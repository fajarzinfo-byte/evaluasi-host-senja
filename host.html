<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07090e">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Senja Studio">
<title>Hasil Evaluasi — Host</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>window.Chart&&(Chart.defaults.color='#808899',Chart.defaults.borderColor='rgba(255,255,255,.06)',Chart.defaults.font.family="'Archivo',system-ui,sans-serif");</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
  /* ════════ SENJA STUDIO · GEL LAMPU STUDIO ════════
     Kaca gelap berasap; warna hanya datang dari gel (brand & platform).
     Status (naik/turun/peringatan) punya warna sendiri, bukan warna gel. */
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root{
    color-scheme:dark;
    --bg:#07090e; --bg-deep:#040509;
    --glass:rgba(17,20,30,.56); --glass-hi:rgba(255,255,255,.055); --glass-lo:rgba(255,255,255,.015);
    --surface:rgba(17,20,30,.56); --surface2:rgba(255,255,255,.05); --surface3:rgba(255,255,255,.085);
    --solid:#10131c;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
    --text:#eef1f7; --text2:#b1b8c8; --text3:#808899;
    /* key light: aksi utama, pilihan aktif, fokus */
    --accent:#e9edf7; --accent-bg:rgba(233,237,247,.09); --accentbg:rgba(233,237,247,.09);
    --key:#e9edf7; --key-ink:#0b0e15;
    /* status */
    --good:#5ee39a; --good-bg:rgba(94,227,154,.12); --goodbg:rgba(94,227,154,.12); --good-border:rgba(94,227,154,.3); --goodbd:rgba(94,227,154,.3);
    --warn:#f5c451; --warn-bg:rgba(245,196,81,.12); --warnbg:rgba(245,196,81,.12); --warn-border:rgba(245,196,81,.3); --warnbd:rgba(245,196,81,.3);
    --bad:#ff6b7d; --bad-bg:rgba(255,107,125,.12); --badbg:rgba(255,107,125,.12); --bad-border:rgba(255,107,125,.32); --badbd:rgba(255,107,125,.32);
    --star-on:#f5c451; --star-off:rgba(255,255,255,.1);
    /* gel platform */
    --tiktok:#3fe0e8; --shopee:#ff7a3d;
    /* gel brand (urutan BRANDS) */
    --gel-1:#a28bff; --gel-2:#5b8cff; --gel-3:#ff5fb4; --gel-4:#c9f25c;
    --twilight:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));
    --dusk:var(--solid);
    --r:14px; --rs:9px; --radius:14px; --radius-sm:9px;
    --lift:inset 0 1px 0 rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.055), 0 22px 44px -28px rgba(0,0,0,.85);
    --blur:blur(22px) saturate(150%);
    --ease:cubic-bezier(.16,1,.3,1);
    --font:'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  html{ background:#07090e; scrollbar-color:rgba(255,255,255,.16) transparent; -webkit-text-size-adjust:100%; }
  body{ font-family:var(--font); font-size:14px; line-height:1.55; color:var(--text); min-height:100vh;
    background:transparent; -webkit-font-smoothing:antialiased; font-feature-settings:'cv11' 1; }
  /* lampu studio: tiga gel di luar bingkai, menyala tembus kaca */
  body::before{ content:''; position:fixed; inset:-10vh -10vw; z-index:-1; pointer-events:none;
    background:
      radial-gradient(40vw 36vh at 86% 2%, rgba(162,139,255,.26), transparent 70%),
      radial-gradient(34vw 34vh at 4% 34%, rgba(91,140,255,.2), transparent 70%),
      radial-gradient(44vw 38vh at 60% 104%, rgba(255,95,180,.2), transparent 70%),
      radial-gradient(26vw 26vh at 100% 70%, rgba(201,242,92,.08), transparent 70%),
      radial-gradient(46vw 40vh at 50% 32%, rgba(162,139,255,.12), transparent 72%),
      radial-gradient(120vw 90vh at 50% 40%, transparent 55%, var(--bg-deep) 100%),
      var(--bg); }
  ::selection{ background:rgba(233,237,247,.28); color:#fff; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.13); border-radius:10px; border:3px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.24); background-clip:padding-box; border:3px solid transparent; }
  :focus-visible{ outline:2px solid var(--key); outline-offset:2px; border-radius:6px; }
  input, select, textarea, button{ font-family:inherit; color:inherit; }
  input::placeholder, textarea::placeholder{ color:#6d7586; }
  select option{ background:var(--solid); color:var(--text); }
  input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(.85); opacity:.7; cursor:pointer; }
  a{ color:inherit; text-underline-offset:3px; }
  .ic{ width:18px; height:18px; flex-shrink:0; vertical-align:-3px; }
  .ic.sm{ width:14px; height:14px; vertical-align:-2px; }
  .ic.lg{ width:22px; height:22px; }
  /* angka: sel tetap, tidak menggeser layout saat berubah */
  .num, .stat-v, .hero-num, .calc-v, .stat-value, .host-score, .eval-score, .section-avg, td{ font-variant-numeric:tabular-nums; }
  /* angka utama: sedikit dipadatkan seperti nomor di swatch gel */
  .hero-num, .stat-v, .stat-value, .host-score, .eval-score{ font-stretch:88%; }

  /* ── Kaca ── */
  .glass{ background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), var(--glass);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift); border-radius:var(--r); }

  /* ── Tombol ── */
  .btn-primary, .btn-accent{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--key); color:var(--key-ink); border:0; border-radius:10px; font-weight:600; cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 24px -12px rgba(233,237,247,.55);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s; }
  .btn-primary{ width:100%; padding:12px; font-size:14px; }
  .btn-accent{ padding:10px 18px; font-size:13px; }
  .btn-primary:hover, .btn-accent:hover{ background:#fff; transform:translateY(-1px); box-shadow:0 1px 0 #fff inset, 0 14px 30px -12px rgba(233,237,247,.7); }
  .btn-primary:active, .btn-accent:active{ transform:translateY(0); }
  .btn-primary:disabled, .btn-accent:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-ghost{ display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:10px; border:0;
    background:var(--surface2); box-shadow:inset 0 0 0 1px var(--border2); color:var(--text2); font-size:12.5px; font-weight:500;
    cursor:pointer; text-decoration:none; transition:background .15s, color .15s; }
  .btn-ghost:hover{ background:var(--surface3); color:var(--text); }

  /* ── Form ── */
  .fg{ display:flex; flex-direction:column; }
  .fg.full{ grid-column:1 / -1; }
  .fg label{ font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px; }
  .fg input, .fg select, .fg textarea, .filter-row select, .month-sel{
    width:100%; padding:9px 12px; border:0; border-radius:var(--rs); font-size:13.5px; color:var(--text);
    background:rgba(4,6,10,.45); box-shadow:inset 0 0 0 1px var(--border2), inset 0 1px 2px rgba(0,0,0,.35); outline:none;
    transition:box-shadow .15s, background .15s; }
  .fg input:hover, .fg select:hover, .filter-row select:hover, .month-sel:hover{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), inset 0 1px 2px rgba(0,0,0,.35); }
  .fg input:focus, .fg select:focus, .fg textarea:focus, .filter-row select:focus, .month-sel:focus{
    box-shadow:inset 0 0 0 1px var(--key), 0 0 0 4px rgba(233,237,247,.08); background:rgba(4,6,10,.6); }
  .hint{ font-size:12px; color:var(--text3); margin-top:4px; }
  .msg{ display:none; margin-top:12px; font-size:13px; }

  /* ── Status: dicap, tidak menghilang ── */
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px;
    background:var(--surface2); color:var(--text2); box-shadow:inset 0 0 0 1px var(--border2); white-space:nowrap; }
  .gel-dot{ display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--gel,#fff);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35); margin-right:7px; vertical-align:1px; flex-shrink:0; }
  .stamp{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px; white-space:nowrap; }
  .stamp.good{ color:var(--good); background:var(--good-bg); box-shadow:inset 0 0 0 1px var(--good-border); }
  .stamp.warn{ color:var(--warn); background:var(--warn-bg); box-shadow:inset 0 0 0 1px var(--warn-border); }
  .stamp.bad{ color:var(--bad); background:var(--bad-bg); box-shadow:inset 0 0 0 1px var(--bad-border); }
  .stamp.mute{ color:var(--text2); background:var(--surface2); box-shadow:inset 0 0 0 1px var(--border2); }

  /* ── Tabel ── */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ background:rgba(255,255,255,.035); text-align:left; padding:10px 12px; font-weight:600; color:var(--text3); font-size:11.5px;
    white-space:nowrap; border-bottom:1px solid var(--border); }
  td{ padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover td{ background:rgba(255,255,255,.035); }
  .num{ text-align:right; }

  /* ── Toast ── */
  .toast{ position:fixed; bottom:24px; right:24px; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:500;
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), rgba(17,20,30,.82); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    box-shadow:var(--lift), 0 18px 40px -16px rgba(0,0,0,.7); z-index:9999; opacity:0; transform:translateY(8px);
    transition:opacity .22s var(--ease), transform .22s var(--ease); pointer-events:none; max-width:min(420px,calc(100vw - 32px)); }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.success{ color:var(--good); box-shadow:var(--lift), inset 0 0 0 1px var(--good-border); }
  .toast.error{ color:var(--bad); box-shadow:var(--lift), inset 0 0 0 1px var(--bad-border); }

  /* ── Modal ── */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(3,4,8,.62); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    z-index:200; align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.open{ display:flex; animation:fadeIn .2s var(--ease); }
  .modal-box{ width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)), rgba(14,17,26,.86);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift), 0 40px 90px -30px rgba(0,0,0,.9);
    animation:rise .28s var(--ease); }
  .modal-top{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
  .modal-h{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .modal-x{ background:none; border:0; font-size:22px; line-height:1; cursor:pointer; color:var(--text3); padding:2px 8px; border-radius:8px; }
  .modal-x:hover{ color:var(--text); background:var(--surface2); }
  .modal-content{ padding:18px 20px; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--border); }

  /* ── Skeleton ── */
  .skel{ background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.09) 45%,rgba(255,255,255,.04) 60%);
    background-size:300% 100%; animation:skel 1.3s linear infinite; border-radius:14px; }
  @keyframes skel{ from{background-position:120% 0} to{background-position:-60% 0} }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes rise{ from{opacity:0; transform:translateY(10px) scale(.985)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }
  /* ── Tanda studio, login, header (halaman evaluasi) ── */
  .brand-dot{ position:relative; isolation:isolate; width:34px; height:34px; flex-shrink:0; border-radius:0; box-shadow:none;
    background:linear-gradient(var(--gel-3),var(--gel-3)) 28% 100% / 60% 60% no-repeat; }
  .brand-dot::before, .brand-dot::after{ content:''; position:absolute; width:60%; height:60%; border-radius:4px; mix-blend-mode:screen; }
  .brand-dot::before{ left:0; top:0; background:var(--gel-1); }
  .brand-dot::after{ right:0; top:16%; background:var(--tiktok); }
  .brand-mark{ display:flex; align-items:center; gap:12px; margin-bottom:1.5rem; }
  .brand-name{ font-size:18px; font-weight:600; letter-spacing:-.02em; color:var(--text); }
  .brand-name span{ color:var(--text3); font-weight:500; }
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.25rem; position:relative; overflow:hidden; }
  .login-wrap::before{ content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(22vw 34vh at 18% 100%, rgba(162,139,255,.55), transparent 70%), radial-gradient(22vw 34vh at 40% 100%, rgba(91,140,255,.5), transparent 70%), radial-gradient(22vw 34vh at 62% 100%, rgba(255,95,180,.5), transparent 70%), radial-gradient(22vw 34vh at 84% 100%, rgba(201,242,92,.32), transparent 70%); filter:blur(14px); }
  .login-card{ position:relative; z-index:1; width:100%; max-width:400px; padding:2.25rem; border-radius:20px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)), rgba(14,17,26,.55);
    -webkit-backdrop-filter:blur(28px) saturate(160%); backdrop-filter:blur(28px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.07), 0 40px 80px -30px rgba(0,0,0,.9); }
  .login-card h1{ font-size:20px; font-weight:600; letter-spacing:-.02em; margin-bottom:6px; }
  .login-card p{ font-size:13.5px; color:var(--text2); margin-bottom:1.25rem; }
  .login-card input{ width:100%; padding:12px 14px; border:0; border-radius:10px; font-size:14px; margin-bottom:10px; background:rgba(4,6,10,.5); box-shadow:inset 0 0 0 1px var(--border2); outline:none; }
  .login-card input:focus{ box-shadow:inset 0 0 0 1px var(--key), 0 0 0 4px rgba(233,237,247,.08); }
  .app-header{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:1.6rem; }
  .app-header h1{ font-size:20px; font-weight:600; letter-spacing:-.025em; line-height:1.2; }
  .app-header p{ font-size:13px; color:var(--text3); margin-top:2px; }
  .btn-logout{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:10px; border:0; background:var(--surface2);
    box-shadow:inset 0 0 0 1px var(--border2); color:var(--text2); font-size:12.5px; font-weight:500; cursor:pointer; text-decoration:none; transition:background .15s,color .15s; }
  .btn-logout:hover{ background:var(--surface3); color:var(--text); }
  .section-title{ font-size:16px; font-weight:600; letter-spacing:-.015em; margin-bottom:1rem; }
  .empty{ text-align:center; padding:3rem 1rem; color:var(--text3); font-size:13.5px; }
  .stat, .chart-card, .progress-card, .eval-card, .target-box{
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), var(--glass);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift); border:0; border-radius:var(--r); }
  .stat{ padding:14px 16px; text-align:left; }
  .stat-label{ font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px; }
  .stat-value{ font-size:22px; font-weight:600; color:var(--text); letter-spacing:-.025em; line-height:1.2; }
  .stat-value.good{ color:var(--good); } .stat-value.warn{ color:var(--warn); } .stat-value.bad{ color:var(--bad); }
  .chart-card{ padding:16px 18px; margin-bottom:1.4rem; }
  .chart-title{ font-size:13.5px; font-weight:600; margin-bottom:14px; }
  .chart-wrap{ height:200px; position:relative; }
  /* skor per area: batang tipis, warna status */
  .progress-card{ padding:16px 18px; margin-bottom:1.4rem; }
  .progress-title{ font-size:13.5px; font-weight:600; margin-bottom:12px; }
  .progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:9px; }
  .progress-label{ font-size:12.5px; color:var(--text2); width:170px; flex-shrink:0; }
  .progress-bar-wrap{ flex:1; height:6px; background:rgba(255,255,255,.07); border-radius:6px; overflow:hidden; }
  .progress-bar{ height:100%; border-radius:6px; background:var(--key); transition:width .6s var(--ease); }
  .progress-val{ font-size:12.5px; font-weight:600; width:32px; text-align:right; font-variant-numeric:tabular-nums; }
  /* riwayat evaluasi */
  .eval-card{ margin-bottom:10px; overflow:hidden; }
  .eval-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 16px; cursor:pointer; transition:background .15s; }
  .eval-head:hover{ background:rgba(255,255,255,.035); }
  .eval-title{ font-size:14px; font-weight:600; }
  .eval-meta{ font-size:12.5px; color:var(--text3); margin-top:1px; }
  .eval-score{ font-size:17px; font-weight:600; letter-spacing:-.02em; }
  .eval-score.good{ color:var(--good); } .eval-score.warn{ color:var(--warn); } .eval-score.bad{ color:var(--bad); }
  .eval-body{ display:none; border-top:1px solid var(--border); padding:14px 16px; }
  .eval-body.open{ display:block; animation:fadeIn .2s var(--ease); }
  .sec-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; font-variant-numeric:tabular-nums; }
  .sec-row:last-child{ border-bottom:none; }
  .sec-name{ color:var(--text2); }
  .verdict-box{ border-radius:var(--rs); padding:10px 14px; margin-top:12px; font-size:13px; font-weight:500; }
  .verdict-box.good{ background:var(--good-bg); box-shadow:inset 0 0 0 1px var(--good-border); color:var(--good); }
  .verdict-box.warn{ background:var(--warn-bg); box-shadow:inset 0 0 0 1px var(--warn-border); color:var(--warn); }
  .verdict-box.bad{ background:var(--bad-bg); box-shadow:inset 0 0 0 1px var(--bad-border); color:var(--bad); }
  .commitment-note{ margin-top:10px; padding:11px 14px; background:rgba(4,6,10,.35); box-shadow:inset 0 0 0 1px var(--border); border-radius:var(--rs); font-size:13px; color:var(--text2); }
  .commitment-note strong{ color:var(--text); display:block; margin-bottom:3px; font-size:12px; font-weight:600; }
  .commitment-note.target{ background:var(--warn-bg); box-shadow:inset 0 0 0 1px var(--warn-border); }
  .commitment-note.target strong{ color:var(--warn); }
  .skel-row{ height:64px; margin-bottom:10px; }
  /* ── host.html ── */
  .success-msg{ display:none; margin-top:12px; font-size:13px; color:var(--good); }
  .app-wrap{ display:none; max-width:760px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }
  .stats-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:1.4rem; }
  /* target dari leader: kartu kaca dengan cap status */
  .target-box{ padding:16px 18px; margin-bottom:1.4rem; box-shadow:var(--lift), inset 0 0 0 1px var(--warn-border); }
  .target-label{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--warn); margin-bottom:8px; }
  .target-text{ font-size:15px; line-height:1.5; color:var(--text); margin-bottom:14px; max-width:62ch; }
  .btn-ack{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:10px; border:0; cursor:pointer; font-size:13px; font-weight:600;
    background:var(--key); color:var(--key-ink); box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 24px -12px rgba(233,237,247,.55); transition:transform .18s var(--ease), background .15s; }
  .btn-ack:hover{ background:#fff; transform:translateY(-1px); }
  .ack-done{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:6px;
    color:var(--good); background:var(--good-bg); box-shadow:inset 0 0 0 1px var(--good-border); }
  @media (max-width:480px){ .stats-grid{ grid-template-columns:1fr 1fr; } .login-card{ padding:1.5rem; } .progress-label{ width:110px; font-size:11.5px; } }
  @media (min-width:1100px){ .app-wrap{ max-width:880px; padding-top:2rem; } }
</style>
</head>
<body>

<div class="login-wrap" id="login-section" style="display:none">
  <div class="login-card">
    <div class="brand-mark"><div class="brand-dot"></div><div class="brand-name">Senja <span>Studio</span></div></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem">Mengarahkan ke halaman login…</p>
    <a class="btn-primary" href="https://tinyurl.com/performa-senja" style="display:block;text-align:center;text-decoration:none">Ke Beranda</a>
  </div>
</div>

<div class="app-wrap" id="app-section">
  <div class="app-header">
    <div style="display:flex;align-items:center;gap:11px">
      <div class="brand-dot" style="width:30px;height:30px"></div>
      <div>
        <h1 id="host-greeting">Halo!</h1>
        <p id="host-brand"></p>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="btn-logout" href="https://tinyurl.com/performa-senja" style="text-decoration:none">← Beranda</a>
      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat"><div class="stat-label">Total evaluasi</div><div class="stat-value" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-label">Skor terkini</div><div class="stat-value" id="stat-latest">—</div></div>
    <div class="stat"><div class="stat-label">Tren</div><div class="stat-value" id="stat-trend">—</div></div>
  </div>

  <div id="target-section" style="display:none" class="target-box">
    <div class="target-label"><svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg> Target dari leader</div>
    <div class="target-text" id="target-text"></div>
    <div id="ack-area"></div>
  </div>

  <div class="chart-card" id="chart-card" style="display:none">
    <div class="chart-title">Perkembangan skor evaluasi</div>
    <div class="chart-wrap"><canvas id="progress-chart"></canvas></div>
  </div>

  <div class="progress-card" id="progress-card" style="display:none">
    <div class="progress-title">Skor per area (evaluasi terkini)</div>
    <div id="progress-bars"></div>
  </div>

  <div class="section-title">Riwayat evaluasi</div>
  <div id="eval-list"><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = 'https://pwqozfqqaewjpnpkydpo.supabase.co';
const SUPABASE_ANON = 'sb_publishable_1VeUHXivMJkjqKGnAP4_vw_tr614ZcW';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Config tim dinamis dari tabel app_config ──
let HOST_MAP={};
let chartInstance = null;   // grafik perkembangan skor (sebelumnya tidak dideklarasikan → halaman berhenti di sini)
async function loadConfig(){
  const {data,error}=await sb.from('app_config').select('hosts').eq('id',1).single();
  if(error||!data) return false;
  HOST_MAP={};
  Object.entries(data.hosts||{}).forEach(([email,v])=>{
    HOST_MAP[email]={name:v.name, brand:(v.brands||[]).join(' · '), active:v.active!==false};
  });
  return true;
}

async function loadHostData(email) {
  if(!(await loadConfig())){ alert('Config tim belum ada di database. Hubungi leader.'); return; }
  const hostInfo = HOST_MAP[email];
  if (!hostInfo) { alert('Akun ini tidak terdaftar sebagai host.'); await sb.auth.signOut(); return; }
  if (hostInfo.active===false) { alert('Akun kamu sudah dinonaktifkan. Hubungi leader ya.'); await sb.auth.signOut(); return; }

  document.getElementById('login-section').style.display = 'none';
  document.getElementById('app-section').style.display = 'block';
  document.getElementById('host-greeting').textContent = 'Halo, ' + hostInfo.name + '!';
  document.getElementById('host-brand').textContent = 'Brand: ' + hostInfo.brand;

  const { data, error } = await sb.from('evaluasi_host').select('*').eq('host_email', email).order('created_at', { ascending: true });
  if (error || !data || !data.length) { document.getElementById('stat-total').textContent = '0'; document.getElementById('eval-list').innerHTML = '<p class="empty">Belum ada evaluasi.</p>'; return; }

  const latest = data[data.length - 1];
  const latestAvg = parseFloat(latest.avg);
  const cls = latestAvg >= 4 ? 'good' : latestAvg >= 2.5 ? 'warn' : 'bad';

  document.getElementById('stat-total').textContent = data.length;
  const latestEl = document.getElementById('stat-latest');
  latestEl.textContent = latestAvg.toFixed(1);
  latestEl.className = 'stat-value ' + cls;

  if (data.length >= 2) {
    const prev = parseFloat(data[data.length - 2].avg);
    const diff = latestAvg - prev;
    const trendEl = document.getElementById('stat-trend');
    if (diff > 0.05) { trendEl.textContent = '↑ +' + diff.toFixed(1); trendEl.className = 'stat-value good'; }
    else if (diff < -0.05) { trendEl.textContent = '↓ ' + diff.toFixed(1); trendEl.className = 'stat-value bad'; }
    else { trendEl.textContent = '→ Stabil'; trendEl.className = 'stat-value'; }
  }

  // Target from latest eval
  if (latest.target && !latest.target_acknowledged) {
    document.getElementById('target-section').style.display = 'block';
    document.getElementById('target-text').textContent = latest.target;
    document.getElementById('ack-area').innerHTML = `<button class="btn-ack" onclick="acknowledgeTarget(${latest.id})"><svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Saya mengerti dan akan berusaha mencapai ini</button>`;
  } else if (latest.target && latest.target_acknowledged) {
    document.getElementById('target-section').style.display = 'block';
    document.getElementById('target-text').textContent = latest.target;
    document.getElementById('ack-area').innerHTML = `<span class="ack-done"><svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Sudah dikonfirmasi</span>`;
  }

  // Progress chart
  if (data.length > 1) {
    document.getElementById('chart-card').style.display = 'block';
    const labels = data.map((d, i) => d.evaluasi_ke ? 'Evaluasi ' + d.evaluasi_ke : 'Eval ' + (i+1));
    const scores = data.map(d => parseFloat(d.avg));
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById('progress-chart'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Rata-rata',
          data: scores,
          borderColor: 'rgba(233,237,247,.9)',
          backgroundColor: 'rgba(233,237,247,.07)',
          tension: 0.3,
          pointBackgroundColor: '#e9edf7',
          pointRadius: 5,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { min: 0, max: 5, ticks: { stepSize: 1, font: { size: 11 } }, grid: { color: 'rgba(255,255,255,.05)' } },
          x: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });
  }

  // Progress bars (latest)
  if (latest.sections) {
    document.getElementById('progress-card').style.display = 'block';
    document.getElementById('progress-bars').innerHTML = latest.sections.map(sec => {
      const vals = sec.scores.filter(v => v > 0);
      const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
      const pct = Math.round(avg / 5 * 100);
      const barColor = avg >= 4 ? 'var(--good)' : avg >= 2.5 ? 'var(--warn)' : 'var(--bad)';
      return `<div class="progress-row">
        <span class="progress-label">${sec.title}</span>
        <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%;background:${barColor}"></div></div>
        <span class="progress-val">${avg.toFixed(1)}</span>
      </div>`;
    }).join('');
  }

  // Eval list (newest first)
  const reversed = [...data].reverse();
  document.getElementById('eval-list').innerHTML = reversed.map((ev, idx) => {
    const avg = parseFloat(ev.avg);
    const ecls = avg >= 4 ? 'good' : avg >= 2.5 ? 'warn' : 'bad';
    const tgl = ev.tanggal ? new Date(ev.tanggal + 'T00:00:00').toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}) : '—';
    const evalKe = ev.evaluasi_ke ? 'Evaluasi ke-' + ev.evaluasi_ke : 'Evaluasi #' + (data.length - idx);
    const verdict = avg >= 4 ? 'Performa sangat baik! Pertahankan konsistensi ini.' : avg >= 3 ? 'Performa cukup baik, ada beberapa area yang bisa ditingkatkan.' : 'Masih perlu improvement — yuk fokus ke poin yang skornya rendah dulu.';
    const secRows = (ev.sections||[]).map(sec => {
      const vals = sec.scores.filter(v=>v>0);
      const sa = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : '—';
      return `<div class="sec-row"><span class="sec-name">${sec.title}</span><span>${sa}/5</span></div>`;
    }).join('');
    const commitHtml = ev.commitment ? `<div class="commitment-note"><strong>Komitmen kamu</strong>${ev.commitment}</div>` : '';
    const targetHtml = ev.target ? `<div class="commitment-note target"><strong>Target dari leader</strong>${ev.target}</div>` : '';
    return `<div class="eval-card">
      <div class="eval-head" onclick="this.nextElementSibling.classList.toggle('open')">
        <div><div class="eval-title">${evalKe}</div><div class="eval-meta">${tgl}</div></div>
        <div class="eval-score ${ecls}">${avg.toFixed(1)}/5</div>
      </div>
      <div class="eval-body">${secRows}<div class="verdict-box ${ecls}">${verdict}</div>${targetHtml}${commitHtml}</div>
    </div>`;
  }).join('');
}

async function acknowledgeTarget(id) {
  const { error } = await sb.from('evaluasi_host').update({ target_acknowledged: true }).eq('id', id);
  if (!error) {
    document.getElementById('ack-area').innerHTML = `<span class="ack-done"><svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Sudah dikonfirmasi</span>`;
  }
}

async function logout() { await sb.auth.signOut(); location.reload(); }

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    loadHostData(session.user.email.toLowerCase());
  } else {
    // Login terpusat di Beranda — tampilkan layar pengalihan lalu arahkan
    document.getElementById('login-section').style.display = 'flex';
    window.location.href = 'https://tinyurl.com/performa-senja';
  }
}

init();
</script>
</body>
</html>
