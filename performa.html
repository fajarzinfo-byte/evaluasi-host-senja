<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07090e">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Senja Studio">
<title>Performa Live — Host</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>window.Chart&&(Chart.defaults.color='#808899',Chart.defaults.borderColor='rgba(255,255,255,.06)',Chart.defaults.font.family="'Archivo',system-ui,sans-serif");</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
  /* ════════ SENJA STUDIO · GEL LAMPU STUDIO ════════
     Kaca gelap berasap; warna hanya datang dari gel (brand & platform).
     Status (naik/turun/peringatan) punya warna sendiri, bukan warna gel. */
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root{
    color-scheme:dark;
    --bg:#07090e; --bg-deep:#040509;
    --glass:rgba(17,20,30,.56); --glass-hi:rgba(255,255,255,.055); --glass-lo:rgba(255,255,255,.015);
    --surface:rgba(17,20,30,.56); --surface2:rgba(255,255,255,.05); --surface3:rgba(255,255,255,.085);
    --solid:#10131c;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
    --text:#eef1f7; --text2:#b1b8c8; --text3:#808899;
    /* key light: aksi utama, pilihan aktif, fokus */
    --accent:#e9edf7; --accent-bg:rgba(233,237,247,.09); --accentbg:rgba(233,237,247,.09);
    --key:#e9edf7; --key-ink:#0b0e15;
    /* status */
    --good:#5ee39a; --good-bg:rgba(94,227,154,.12); --goodbg:rgba(94,227,154,.12); --good-border:rgba(94,227,154,.3); --goodbd:rgba(94,227,154,.3);
    --warn:#f5c451; --warn-bg:rgba(245,196,81,.12); --warnbg:rgba(245,196,81,.12); --warn-border:rgba(245,196,81,.3); --warnbd:rgba(245,196,81,.3);
    --bad:#ff6b7d; --bad-bg:rgba(255,107,125,.12); --badbg:rgba(255,107,125,.12); --bad-border:rgba(255,107,125,.32); --badbd:rgba(255,107,125,.32);
    --star-on:#f5c451; --star-off:rgba(255,255,255,.1);
    /* gel platform */
    --tiktok:#3fe0e8; --shopee:#ff7a3d;
    /* gel brand (urutan BRANDS) */
    --gel-1:#a28bff; --gel-2:#5b8cff; --gel-3:#ff5fb4; --gel-4:#c9f25c;
    --twilight:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));
    --dusk:var(--solid);
    --r:14px; --rs:9px; --radius:14px; --radius-sm:9px;
    --lift:inset 0 1px 0 rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.055), 0 22px 44px -28px rgba(0,0,0,.85);
    --blur:blur(22px) saturate(150%);
    --ease:cubic-bezier(.16,1,.3,1);
    --font:'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  html{ background:#07090e; scrollbar-color:rgba(255,255,255,.16) transparent; -webkit-text-size-adjust:100%; }
  body{ font-family:var(--font); font-size:14px; line-height:1.55; color:var(--text); min-height:100vh;
    background:transparent; -webkit-font-smoothing:antialiased; font-feature-settings:'cv11' 1; }
  /* lampu studio: tiga gel di luar bingkai, menyala tembus kaca */
  body::before{ content:''; position:fixed; inset:-10vh -10vw; z-index:-1; pointer-events:none;
    background:
      radial-gradient(40vw 36vh at 86% 2%, rgba(162,139,255,.26), transparent 70%),
      radial-gradient(34vw 34vh at 4% 34%, rgba(91,140,255,.2), transparent 70%),
      radial-gradient(44vw 38vh at 60% 104%, rgba(255,95,180,.2), transparent 70%),
      radial-gradient(26vw 26vh at 100% 70%, rgba(201,242,92,.08), transparent 70%),
      radial-gradient(46vw 40vh at 50% 32%, rgba(162,139,255,.12), transparent 72%),
      radial-gradient(120vw 90vh at 50% 40%, transparent 55%, var(--bg-deep) 100%),
      var(--bg); }
  ::selection{ background:rgba(233,237,247,.28); color:#fff; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.13); border-radius:10px; border:3px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.24); background-clip:padding-box; border:3px solid transparent; }
  :focus-visible{ outline:2px solid var(--key); outline-offset:2px; border-radius:6px; }
  input, select, textarea, button{ font-family:inherit; color:inherit; }
  input::placeholder, textarea::placeholder{ color:#6d7586; }
  select option{ background:var(--solid); color:var(--text); }
  input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(.85); opacity:.7; cursor:pointer; }
  a{ color:inherit; text-underline-offset:3px; }
  .ic{ width:18px; height:18px; flex-shrink:0; vertical-align:-3px; }
  .ic.sm{ width:14px; height:14px; vertical-align:-2px; }
  .ic.lg{ width:22px; height:22px; }
  /* angka: sel tetap, tidak menggeser layout saat berubah */
  .num, .stat-v, .hero-num, .calc-v, .stat-value, .host-score, .eval-score, .section-avg, td{ font-variant-numeric:tabular-nums; }
  /* angka utama: sedikit dipadatkan seperti nomor di swatch gel */
  .hero-num, .stat-v, .stat-value, .host-score, .eval-score{ font-stretch:88%; }

  /* ── Kaca ── */
  .glass{ background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), var(--glass);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift); border-radius:var(--r); }

  /* ── Tombol ── */
  .btn-primary, .btn-accent{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--key); color:var(--key-ink); border:0; border-radius:10px; font-weight:600; cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 24px -12px rgba(233,237,247,.55);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s; }
  .btn-primary{ width:100%; padding:12px; font-size:14px; }
  .btn-accent{ padding:10px 18px; font-size:13px; }
  .btn-primary:hover, .btn-accent:hover{ background:#fff; transform:translateY(-1px); box-shadow:0 1px 0 #fff inset, 0 14px 30px -12px rgba(233,237,247,.7); }
  .btn-primary:active, .btn-accent:active{ transform:translateY(0); }
  .btn-primary:disabled, .btn-accent:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-ghost{ display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:10px; border:0;
    background:var(--surface2); box-shadow:inset 0 0 0 1px var(--border2); color:var(--text2); font-size:12.5px; font-weight:500;
    cursor:pointer; text-decoration:none; transition:background .15s, color .15s; }
  .btn-ghost:hover{ background:var(--surface3); color:var(--text); }

  /* ── Form ── */
  .fg{ display:flex; flex-direction:column; }
  .fg.full{ grid-column:1 / -1; }
  .fg label{ font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px; }
  .fg input, .fg select, .fg textarea, .filter-row select, .month-sel{
    width:100%; padding:9px 12px; border:0; border-radius:var(--rs); font-size:13.5px; color:var(--text);
    background:rgba(4,6,10,.45); box-shadow:inset 0 0 0 1px var(--border2), inset 0 1px 2px rgba(0,0,0,.35); outline:none;
    transition:box-shadow .15s, background .15s; }
  .fg input:hover, .fg select:hover, .filter-row select:hover, .month-sel:hover{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), inset 0 1px 2px rgba(0,0,0,.35); }
  .fg input:focus, .fg select:focus, .fg textarea:focus, .filter-row select:focus, .month-sel:focus{
    box-shadow:inset 0 0 0 1px var(--key), 0 0 0 4px rgba(233,237,247,.08); background:rgba(4,6,10,.6); }
  .hint{ font-size:12px; color:var(--text3); margin-top:4px; }
  .msg{ display:none; margin-top:12px; font-size:13px; }

  /* ── Status: dicap, tidak menghilang ── */
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px;
    background:var(--surface2); color:var(--text2); box-shadow:inset 0 0 0 1px var(--border2); white-space:nowrap; }
  .gel-dot{ display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--gel,#fff);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35); margin-right:7px; vertical-align:1px; flex-shrink:0; }
  .stamp{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px; white-space:nowrap; }
  .stamp.good{ color:var(--good); background:var(--good-bg); box-shadow:inset 0 0 0 1px var(--good-border); }
  .stamp.warn{ color:var(--warn); background:var(--warn-bg); box-shadow:inset 0 0 0 1px var(--warn-border); }
  .stamp.bad{ color:var(--bad); background:var(--bad-bg); box-shadow:inset 0 0 0 1px var(--bad-border); }
  .stamp.mute{ color:var(--text2); background:var(--surface2); box-shadow:inset 0 0 0 1px var(--border2); }

  /* ── Tabel ── */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ background:rgba(255,255,255,.035); text-align:left; padding:10px 12px; font-weight:600; color:var(--text3); font-size:11.5px;
    white-space:nowrap; border-bottom:1px solid var(--border); }
  td{ padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover td{ background:rgba(255,255,255,.035); }
  .num{ text-align:right; }

  /* ── Toast ── */
  .toast{ position:fixed; bottom:24px; right:24px; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:500;
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), rgba(17,20,30,.82); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    box-shadow:var(--lift), 0 18px 40px -16px rgba(0,0,0,.7); z-index:9999; opacity:0; transform:translateY(8px);
    transition:opacity .22s var(--ease), transform .22s var(--ease); pointer-events:none; max-width:min(420px,calc(100vw - 32px)); }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.success{ color:var(--good); box-shadow:var(--lift), inset 0 0 0 1px var(--good-border); }
  .toast.error{ color:var(--bad); box-shadow:var(--lift), inset 0 0 0 1px var(--bad-border); }

  /* ── Modal ── */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(3,4,8,.62); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    z-index:200; align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.open{ display:flex; animation:fadeIn .2s var(--ease); }
  .modal-box{ width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)), rgba(14,17,26,.86);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift), 0 40px 90px -30px rgba(0,0,0,.9);
    animation:rise .28s var(--ease); }
  .modal-top{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
  .modal-h{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .modal-x{ background:none; border:0; font-size:22px; line-height:1; cursor:pointer; color:var(--text3); padding:2px 8px; border-radius:8px; }
  .modal-x:hover{ color:var(--text); background:var(--surface2); }
  .modal-content{ padding:18px 20px; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--border); }

  /* ── Skeleton ── */
  .skel{ background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.09) 45%,rgba(255,255,255,.04) 60%);
    background-size:300% 100%; animation:skel 1.3s linear infinite; border-radius:14px; }
  @keyframes skel{ from{background-position:120% 0} to{background-position:-60% 0} }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes rise{ from{opacity:0; transform:translateY(10px) scale(.985)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }
  /* ── Tanda studio: tiga lembar gel bertumpuk ── */
  .brand-dot{ position:relative; isolation:isolate; width:34px; height:34px; flex-shrink:0; border-radius:0; box-shadow:none;
    background:linear-gradient(var(--gel-3),var(--gel-3)) 28% 100% / 60% 60% no-repeat; }
  .brand-dot::before, .brand-dot::after{ content:''; position:absolute; width:60%; height:60%; border-radius:4px; mix-blend-mode:screen; }
  .brand-dot::before{ left:0; top:0; background:var(--gel-1); }
  .brand-dot::after{ right:0; top:16%; background:var(--tiktok); }
  .brand-mark{ display:flex; align-items:center; gap:12px; }
  .brand-name{ font-size:18px; font-weight:600; letter-spacing:-.02em; color:var(--text); }
  .brand-name span{ color:var(--text3); font-weight:500; }

  /* ── Login ── */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.25rem; position:relative; overflow:hidden; }
  .login-wrap::before{ content:''; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(22vw 34vh at 18% 100%, rgba(162,139,255,.55), transparent 70%),
      radial-gradient(22vw 34vh at 40% 100%, rgba(91,140,255,.5), transparent 70%),
      radial-gradient(22vw 34vh at 62% 100%, rgba(255,95,180,.5), transparent 70%),
      radial-gradient(22vw 34vh at 84% 100%, rgba(201,242,92,.32), transparent 70%); filter:blur(14px); }
  .login-card{ position:relative; z-index:1; width:100%; max-width:400px; padding:2.25rem 2.25rem 1.9rem; text-align:left; border-radius:20px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)), rgba(14,17,26,.55);
    -webkit-backdrop-filter:blur(28px) saturate(160%); backdrop-filter:blur(28px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.07), 0 40px 80px -30px rgba(0,0,0,.9); animation:rise .5s var(--ease); }
  .login-card .brand-mark{ margin-bottom:1.75rem; }
  .login-card h1{ font-size:22px; font-weight:600; letter-spacing:-.025em; margin-bottom:6px; line-height:1.2; }
  .login-card p{ font-size:13.5px; color:var(--text2); margin-bottom:1.5rem; }
  .login-card input{ width:100%; padding:12px 14px; border:0; border-radius:10px; font-size:14px; margin-bottom:10px; color:var(--text);
    background:rgba(4,6,10,.5); box-shadow:inset 0 0 0 1px var(--border2); outline:none; transition:box-shadow .15s; }
  .login-card input:focus{ box-shadow:inset 0 0 0 1px var(--key), 0 0 0 4px rgba(233,237,247,.08); }
  .login-card .btn-primary{ margin-top:6px; }
  .login-card .msg{ text-align:left; }

  /* ── Kerangka app ── */
  .app{ display:none; max-width:1480px; margin:0 auto; padding:1.25rem clamp(1rem,3.4vw,3rem) 4rem; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:1.1rem; padding:4px 0 0; }
  .topbar h1{ font-size:20px; font-weight:600; letter-spacing:-.025em; line-height:1.2; }
  .topbar p{ font-size:13px; color:var(--text3); margin-top:2px; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; }

  /* ── Tab: rel kaca ── */
  .tabs{ display:flex; gap:2px; margin-bottom:1.4rem; padding:4px; flex-wrap:wrap; width:fit-content; max-width:100%; border-radius:13px;
    background:rgba(255,255,255,.035); box-shadow:inset 0 0 0 1px var(--border); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
  .tab{ padding:8px 15px; border-radius:9px; font-size:13px; font-weight:500; cursor:pointer; color:var(--text2); white-space:nowrap;
    transition:background .18s var(--ease), color .18s; user-select:none; }
  .tab:hover{ color:var(--text); background:rgba(255,255,255,.05); }
  .tab.active{ color:var(--text); background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 6px 16px -8px rgba(0,0,0,.8); }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fadeIn .25s var(--ease); }

  /* ── Panel isi ── */
  .form-card, .stat, .menu-card, .chart-card, .tbl-wrap, .drop, .ss-drop{
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), var(--glass);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift); border:0; border-radius:var(--r); }
  .form-card{ padding:1.5rem; margin-bottom:1rem; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .group-label{ font-size:13px; font-weight:600; color:var(--text); margin:18px 0 2px; grid-column:1 / -1; display:flex; align-items:center; gap:10px; }
  .group-label::after{ content:''; flex:1; height:1px; background:var(--border); }
  .group-label:first-child{ margin-top:0; }
  .calc-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); grid-column:1 / -1; }
  .calc{ background:rgba(4,6,10,.38); box-shadow:inset 0 0 0 1px var(--border); border-radius:var(--rs); padding:9px 12px; }
  .calc-l{ font-size:11.5px; color:var(--text3); }
  .calc-v{ font-size:16px; font-weight:600; color:var(--text); margin-top:1px; letter-spacing:-.01em; }

  /* ── Statistik ── */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:1.4rem; }
  .stat{ position:relative; overflow:hidden; padding:14px 16px; text-align:left; }
  .stat[style*="--gel"]::before{ content:''; position:absolute; left:-20%; top:-70%; width:90%; height:140%; pointer-events:none;
    background:radial-gradient(closest-side, color-mix(in srgb, var(--gel) 30%, transparent), transparent); }
  .stat > *{ position:relative; }
  .stat-l{ font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px; display:flex; align-items:center; }
  .stat-v{ font-size:21px; font-weight:600; color:var(--text); letter-spacing:-.025em; line-height:1.2; }
  .stat-v.good{ color:var(--good); } .stat-v.warn{ color:var(--warn); } .stat-v.bad{ color:var(--bad); }
  .grp-head{ font-size:13px; font-weight:600; color:var(--text2); margin:0 0 10px 2px; display:flex; align-items:center; gap:10px; }
  .grp-head::after{ content:''; flex:1; height:1px; background:var(--border); }
  .section-title{ font-size:16px; font-weight:600; letter-spacing:-.015em; margin-bottom:1rem; }

  /* ── Menu: lembar gel ── */
  .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .menu-card{ position:relative; overflow:hidden; display:flex; gap:14px; align-items:flex-start; padding:16px 18px; cursor:pointer; color:inherit; text-decoration:none;
    transition:transform .22s var(--ease), box-shadow .22s var(--ease); }
  .menu-card::before{ content:''; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .25s var(--ease);
    background:radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--gel,#e9edf7) 22%, transparent), transparent 60%); }
  .menu-card:hover{ transform:translateY(-2px); box-shadow:var(--lift), 0 26px 40px -26px color-mix(in srgb, var(--gel,#e9edf7) 70%, transparent); }
  .menu-card:hover::before{ opacity:1; }
  .menu-ic{ position:relative; width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--gel,#e9edf7); background:color-mix(in srgb, var(--gel,#e9edf7) 14%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--gel,#e9edf7) 30%, transparent); }
  .menu-t{ position:relative; font-size:14px; font-weight:600; margin:1px 0 2px; letter-spacing:-.01em; }
  .menu-s{ position:relative; font-size:12.5px; color:var(--text3); }

  /* ── Grafik & tabel ── */
  .chart-card{ padding:16px 18px; margin-bottom:1.4rem; }
  .chart-card h3{ font-size:13.5px; font-weight:600; margin-bottom:14px; color:var(--text); }
  .chart-wrap{ height:220px; position:relative; }
  .chart-wrap.sm{ height:160px; }
  .tbl-wrap{ overflow:hidden; margin-bottom:1.4rem; }
  .tbl-scroll{ overflow:auto; max-height:560px; }
  .tbl-scroll th{ position:sticky; top:0; z-index:2; background:rgba(20,24,34,.96); }

// Gel di belakang hero: satu cahaya per brand, lebarnya sebanding porsi GMV
function gelField(parts){
  const live=(parts||[]).filter(p=>p.v>0), tot=live.reduce((a,p)=>a+p.v,0);
  if(!(tot>0)) return '';
  let x=0;
  return `<div class="gel-field" aria-hidden="true">${live.map((p,i)=>{ const sh=p.v/tot, w=Math.max(22,sh*120), c=(x+sh/2)*100; x+=sh;
    return `<i style="--gel:${p.c};left:${(c-w/2).toFixed(1)}%;width:${w.toFixed(1)}%;height:${(90+sh*110).toFixed(0)}%;animation-delay:${i*90}ms"></i>`; }).join('')}</div>`;
}

// ── Angka hero naik dari 0 (hormati prefers-reduced-motion) ──
function countUp(id, target){
  const el=document.getElementById(id); if(!el) return;
  const done=()=>{ el.textContent=rp(target); };
  if(typeof requestAnimationFrame!=='function' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || !(target>0)) return done();
  const t0=performance.now(), D=550;
  requestAnimationFrame(function f(t){
    const q=Math.min(1,(t-t0)/D), e=1-Math.pow(1-q,3);
    el.textContent=rp(target*e);
    if(q<1) requestAnimationFrame(f); else done();
  });
}

// Derived metrics
function derive(r){
  const gmv=+r.gmv||0, pembeli=+r.pembeli||0, impresi=+r.impresi||0, klik=+r.klik_produk||0,
        viewers=+r.viewers||0, likes=+r.likes||0, komentar=+r.komentar||0, durasi=+r.durasi_menit||0;
  return {
    aov: pembeli? gmv/pembeli : 0,
    ctr: impresi? klik/impresi : 0,
    ctor: klik? pembeli/klik : 0,
    gpm: impresi? gmv/impresi*1000 : 0,
    eng: viewers? (likes+komentar)/viewers : 0,
    gmvjam: durasi? gmv/(durasi/60) : 0,
    klik_per_viewer: viewers? klik/viewers : 0,   // Shopee: pengganti CTR (JANGAN dilabeli CTR)
  };
}

// Ambil SEMUA baris live_performance (Supabase batasi 1000/request → paginasi sampai habis)
async function fetchAllPerf(filterFn){
  const PAGE=1000; let from=0, all=[];
  for(;;){
    let q=sb.from('live_performance').select('*');
    if(filterFn) q=filterFn(q);
    q=q.order('tanggal',{ascending:true}).order('sesi',{ascending:true}).range(from, from+PAGE-1);
    const {data,error}=await q;
    if(error) return {data: from===0? null : all, error};
    if(!data||!data.length) break;
    all=all.concat(data);
    if(data.length<PAGE) break;     // halaman terakhir
    from+=PAGE;
  }
  return {data:all, error:null};
}

  const tot = md.reduce((a,r)=>{a.gmv+=+r.gmv||0;a.pembeli+=+r.pembeli||0;a.viewers+=+r.viewers||0;return a;},{gmv:0,pembeli:0,viewers:0});

  const pm = prevMonthOf(curMonth);
  const pd = cutoff>0 ? scope.filter(r=>r.tanggal && r.tanggal.startsWith(pm) && (+r.tanggal.slice(8,10))<=cutoff) : [];

      <div class="complete-head"><span>Kelengkapan data ${monthName}${isRunning?' (s/d hari ini)':''}</span>${totalMiss?`<span class="stamp warn">${ic('alert','sm')} ${totalMiss} belum diisi</span>`:`<span class="stamp good">${ic('check','sm')} Lengkap</span>`}</div>
      ${platRow('tiktok')}${platRow('shopee')}
      ${offAll.length?`<div class="complete-foot">${ic('off','sm')} Libur: ${offAll.join(', ')}</div>`:''}
      ${totalMiss?`<div class="complete-foot">Tanggal itu kamu libur, sakit, cuti, atau tidak ada live? <a href="#" onclick="goTab('p-libur',3);return false" style="color:var(--text);font-weight:600">Tandai di Libur Saya</a></div>`:''}
    </div>`;

  box.innerHTML = `
    <div class="home-filters">
      ${platToggle()}
      <select class="month-sel" onchange="setHomeMonth(this.value)" title="Pilih bulan">${homeMonthOpts(scope, curMonth)}</select>
    </div>
    <div class="hero">
      ${gelField(me.brands.map(b=>({c:brandColor(b), v:md.filter(r=>r.brand===b).reduce((a,r)=>a+(+r.gmv||0),0)})))}
      <div class="hero-grid">
        <div>

            <span class="hero-num" id="heroNum">${rp(tot.gmv)}</span>${chip}

// ── Screenshot (kompres di browser + upload ke Supabase Storage) ──
const SS_BUCKET='screenshots';
function compressImage(file, maxW=1280, quality=0.7){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth, h=img.naturalHeight;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=> b? resolve(b) : reject(new Error('kompres gagal')), 'image/jpeg', quality);
      URL.revokeObjectURL(img.src);
    };
    img.onerror=()=>reject(new Error('file bukan gambar yang valid'));
    img.src=URL.createObjectURL(file);
  });
}
async function uploadScreenshot(file, email, tanggal, sesi){
  const blob=await compressImage(file);
  const safe=String(email).replace(/[^a-z0-9]/gi,'_');
  const path=`${safe}/${tanggal}_s${sesi}_${Date.now()}.jpg`;
  const {error}=await sb.storage.from(SS_BUCKET).upload(path, blob, {contentType:'image/jpeg'});
  if(error) throw error;
  return sb.storage.from(SS_BUCKET).getPublicUrl(path).data.publicUrl;
}
function setupSSInput(fileId, dropId, promptId, previewId){
  const inp=document.getElementById(fileId), drop=document.getElementById(dropId);
  if(!inp||!drop) return;
  const show=f=>{
    const prev=document.getElementById(previewId), pr=document.getElementById(promptId);
    if(f){ prev.src=URL.createObjectURL(f); prev.style.display='block'; if(pr)pr.style.display='none'; }
    else { prev.style.display='none'; if(pr)pr.style.display='block'; }
  };
  drop.onclick=()=>inp.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f){inp.files=e.dataTransfer.files;show(f);}};
  inp.onchange=()=>show(inp.files[0]);
}
function resetSSInput(fileId, promptId, previewId){
  const inp=document.getElementById(fileId); if(inp) inp.value='';
  const prev=document.getElementById(previewId), pr=document.getElementById(promptId);
  if(prev){ prev.style.display='none'; prev.removeAttribute('src'); }
  if(pr) pr.style.display='block';
}

// ── Paste screenshot from clipboard (Ctrl+V) ──
function setSSFromBlob(blob, fileId, promptId, previewId){
  const inp=document.getElementById(fileId);
  if(!inp) return false;
  const file=new File([blob], 'pasted_'+Date.now()+'.png', {type:blob.type||'image/png'});
  try{ const dt=new DataTransfer(); dt.items.add(file); inp.files=dt.files; }
  catch(e){ showToast('Browser tidak mendukung paste. Pakai klik/drag ya.','error'); return false; }
  const prev=document.getElementById(previewId), pr=document.getElementById(promptId);
  if(prev){ prev.src=URL.createObjectURL(file); prev.style.display='block'; }
  if(pr) pr.style.display='none';
  return true;
}
function handleSSPaste(e){
  const items=(e.clipboardData||window.clipboardData)?.items;
  if(!items) return;
  let blob=null;
  for(const it of items){ if(it.type && it.type.indexOf('image')===0){ blob=it.getAsFile(); break; } }
  if(!blob) return;  // not an image — let normal paste happen (e.g. text into a field)
  // Route to whichever screenshot input is currently active
  let ok=false;
  if(document.getElementById('editModal')?.classList.contains('open')){
    ok=setSSFromBlob(blob,'e_ss_file','e_ss_prompt','e_ss_preview');
  } else if(document.getElementById('f_ss_drop') && document.getElementById('f_ss_drop').offsetParent!==null){
    ok=setSSFromBlob(blob,'f_ss_file','f_ss_prompt','f_ss_preview');
  }
  if(ok){ e.preventDefault(); showToast('Screenshot ditempel. Tinggal simpan.','success'); }
}
document.addEventListener('paste', handleSSPaste);

function renderPerformanceView(box, allData, label, ctx, initMonth){

  const months=[...new Set(allData.filter(r=>r.tanggal).map(r=>r.tanggal.slice(0,7)))].sort().reverse();
  // bulan awal diwarisi dari dashboard (kalau host ini punya data di bulan itu)
  const effMonth=(initMonth && months.includes(initMonth))? initMonth : '';  // ''/null = Semua bulan
  const monthOpts=`<option value="" ${effMonth===''?'selected':''}>Semua bulan</option>`+months.map(m=>{const[y,mo]=m.split('-');return `<option value="${m}" ${m===effMonth?'selected':''}>${new Date(y,mo-1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`}).join('');
  box.innerHTML = `${platToggle()}<div class="filter-row"><label style="font-size:13px;color:var(--text2)">Periode:</label>
    <select id="mf_${ctx}">${monthOpts}</select></div><div id="body_${ctx}"></div>`;

  sel.onchange=()=>{ if(ctx==='drill') DASH_MONTH=sel.value; if(ctx==='mine') MINE_MONTH=sel.value; renderPerfBody(ctx, allData, label, sel.value); };

function renderPerfBody(ctx, allData, label, month){
  const data = platFilter(month? allData.filter(r=>r.tanggal&&r.tanggal.startsWith(month)) : allData);
  const box=document.getElementById('body_'+ctx);
  // libur host ini (drilldown = host yang dibuka, mine = host login) — muncul di riwayat sesi
  const luEmail = ctx==='drill' ? window._drillEmail : (ctx==='mine' ? ME : null);
  const libur = luEmail ? allLibur.filter(l=>l.host_email===luEmail && l.tanggal && (!month || l.tanggal.startsWith(month))) : [];
  if(!data.length){
    box.innerHTML = libur.length
      ? '<p class="empty">Tidak ada data sesi di periode / platform ini.</p>'+[...libur].sort((a,b)=>a.tanggal<b.tanggal?1:-1).map(l=>`<div class="tbl-wrap" style="padding:10px 14px;margin-bottom:6px;color:var(--text2);display:flex;align-items:center;gap:10px"><span class="stamp mute">${ic('off','sm')} Libur</span> ${fmtTgl(l.tanggal)}${l.keterangan?' · '+l.keterangan:''}</div>`).join('')
      : '<p class="empty">Tidak ada data di periode / platform ini.</p>';
    return;
  }
  const tot = data.reduce((a,r)=>{a.gmv+=+r.gmv||0;a.pembeli+=+r.pembeli||0;a.items+=+r.items||0;a.viewers+=+r.viewers||0;a.impresi+=+r.impresi||0;a.klik+=+r.klik_produk||0;a.atc+=+r.atc||0;a.likes+=+r.likes||0;a.kom+=+r.komentar||0;a.foll+=+r.followers_baru||0;return a;},{gmv:0,pembeli:0,items:0,viewers:0,impresi:0,klik:0,atc:0,likes:0,kom:0,foll:0});
  const dTot = derive({gmv:tot.gmv,pembeli:tot.pembeli,impresi:tot.impresi,klik_produk:tot.klik,viewers:tot.viewers,likes:tot.likes,komentar:tot.kom,durasi_menit:0});
  const closing = data.filter(r=>(+r.gmv||0)>0).length;
  const totVwDur = data.reduce((a,r)=>a+((+r.avg_view_dur||0)*(+r.viewers||0)),0);
  const avgDur = tot.viewers? totVwDur/tot.viewers : 0;
  const N = n => (n||0).toLocaleString('id-ID');
  // ── Pembanding bulan lalu (periode hari yang sama) untuk badge ▲▼ di detail ──
  let pTot=null, pD=null, pAvgDur=0, dNote='';
  if(month){
    // Bulan sudah lewat (komplit) → banding bulan penuh vs bulan penuh.
    // Cutoff "sama-sama N hari pertama" hanya untuk bulan berjalan (data belum lengkap).
    const isFullMonth = month < new Date().toISOString().slice(0,7);
    const cutoff = isFullMonth ? 99 : Math.max(0,...data.map(r=>+r.tanggal.slice(8,10)));
    const[yy,mm]=month.split('-').map(Number);
    const pdt=new Date(yy,mm-2,1);
    const pm=`${pdt.getFullYear()}-${String(pdt.getMonth()+1).padStart(2,'0')}`;
    const pdata=platFilter(allData.filter(r=>r.tanggal&&r.tanggal.startsWith(pm)&&(+r.tanggal.slice(8,10))<=cutoff));
    if(cutoff>0 && pdata.length){
      pTot=pdata.reduce((a,r)=>{a.gmv+=+r.gmv||0;a.pembeli+=+r.pembeli||0;a.items+=+r.items||0;a.viewers+=+r.viewers||0;a.impresi+=+r.impresi||0;a.klik+=+r.klik_produk||0;a.atc+=+r.atc||0;a.likes+=+r.likes||0;a.kom+=+r.komentar||0;a.foll+=+r.followers_baru||0;return a;},{gmv:0,pembeli:0,items:0,viewers:0,impresi:0,klik:0,atc:0,likes:0,kom:0,foll:0});
      pTot.sesi=pdata.length;
      pD=derive({gmv:pTot.gmv,pembeli:pTot.pembeli,impresi:pTot.impresi,klik_produk:pTot.klik,viewers:pTot.viewers,likes:pTot.likes,komentar:pTot.kom,durasi_menit:0});
      const pVwDur=pdata.reduce((a,r)=>a+((+r.avg_view_dur||0)*(+r.viewers||0)),0);
      pAvgDur=pTot.viewers? pVwDur/pTot.viewers : 0;
      const ml=(()=>{const[y,mo]=pm.split('-');return new Date(y,mo-1).toLocaleDateString('id-ID',{month:'short',year:'2-digit'})})();
      dNote=`▲▼ vs ${ml} · ${isFullMonth ? 'dibandingkan bulan penuh' : `dibandingkan sama-sama ${cutoff} hari pertama`}`;
    }
  }
  const dl=(c,p)=> pTot? deltaSpan(c, p) : '';   // delta (kosong kalau tak ada bulan pembanding)
  const isS = PLAT_VIEW==='shopee', isAll = PLAT_VIEW==='all';
  // Traffic: TikTok pakai Impresi; Shopee pakai ATC; Gabungan tampilkan dua-duanya ringkas
  const trafficThird = isS
    ? `<div class="stat"><div class="stat-l">ATC</div><div class="stat-v">${N(tot.atc)}${dl(tot.atc, pTot?pTot.atc:null)}</div></div>`
    : `<div class="stat"><div class="stat-l">Impresi</div><div class="stat-v">${N(tot.impresi)}${dl(tot.impresi, pTot?pTot.impresi:null)}</div></div>`;
  // Konversi per platform

  const [{data,error}] = await Promise.all([fetchAllPerf(), fetchLibur()]);
  if(error){document.getElementById('dashContent').innerHTML='<p class="empty">Gagal memuat.</p>';return;}
  allPerf=data||[];
  renderDash();
  renderLeaderHome();
  renderCompare();
  renderTrend();
  renderLibur();
}

            <span class="hero-num" id="heroNum">${rp(tot.gmv)}</span>${chip}

          </div>
        </div>
        <div class="hero-spark"><div class="hero-spark-l">GMV harian tim</div><canvas id="heroSpark"></canvas></div>
      </div>
      ${note?`<div class="hero-note">${note}</div>`:''}
      ${md.length===0?`<div class="hero-empty">${isRunning?'Belum ada data bulan ini.':'Tidak ada data di bulan ini.'}</div>`:''}
    </div>

    <div class="grp-head">GMV per Brand — ${monthName}</div>
    <div class="stats" style="margin-bottom:1.3rem">
      ${brandStats.map(s=>`<div class="stat" style="--gel:${brandColor(s.b)}"><div class="stat-l"><i class="gel-dot"></i>${s.b}</div><div class="stat-v">${rp(s.gmv)}${deltaSpan(s.gmv, s.pg)}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${s.sesi} sesi</div></div>`).join('')}
      <div class="stat"><div class="stat-l">Semua Brand</div><div class="stat-v">${rp(tot.gmv)}${deltaSpan(tot.gmv, pt.gmv)}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${md.length} sesi</div></div>

function goLeaderTab(panelId, tabIdx){
  if(window._reflowAt && Date.now()-window._reflowAt<350) return;  // tap susulan dari toggle
  const tabs=document.querySelectorAll('#tabs .tab');
  tabs.forEach((t,i)=>t.classList.toggle('active', i===tabIdx));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(panelId).classList.add('active');
}

// filter dashboard yang persist (biar nggak ke-reset saat drilldown / balik)
let DASH_BRAND='', DASH_MONTH=null;
function renderDash(){
  window._drillEmail=null;
  const box=document.getElementById('dashContent');
  // build month options
  const months=[...new Set(allPerf.filter(r=>r.tanggal).map(r=>r.tanggal.slice(0,7)))].sort().reverse();
  if(DASH_MONTH===null){ const tm=new Date().toISOString().slice(0,7); DASH_MONTH = months.includes(tm)?tm:(months[0]||''); }
  const curMonth=DASH_MONTH;
  const curBrand=DASH_BRAND;

  const monthOpts=`<option value="">Semua bulan</option>`+months.map(m=>{const[y,mo]=m.split('-');return `<option value="${m}" ${m===curMonth?'selected':''}>${new Date(y,mo-1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`}).join('');

  const filtered=platFilter(allPerf.filter(r=>(!curBrand||r.brand===curBrand)&&(!curMonth||(r.tanggal&&r.tanggal.startsWith(curMonth)))));

  const tot=filtered.reduce((a,r)=>{a.gmv+=+r.gmv||0;a.pembeli+=+r.pembeli||0;a.impresi+=+r.impresi||0;a.klik+=+r.klik_produk||0;a.viewers+=+r.viewers||0;return a;},{gmv:0,pembeli:0,impresi:0,klik:0,viewers:0});
  const dT=derive({gmv:tot.gmv,pembeli:tot.pembeli,impresi:tot.impresi,klik_produk:tot.klik,viewers:tot.viewers,likes:0,komentar:0,durasi_menit:0});

  // ── Perbandingan bulan-ke-bulan (badge di kartu host) ──
  // Hanya saat 1 bulan dipilih. Bandingkan periode SAMA: kalau bulan dipilih baru
  // terisi sampai tgl D, dibandingkan dengan tgl 1–D bulan sebelumnya (adil).
  const showMoM = !!curMonth;
  let momCutoff=0, prevMonth=null, momNote='', momFull=false;
  const mlabelShort=m=>{const[y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('id-ID',{month:'short',year:'2-digit'})};
  if(showMoM){
    const scope=platFilter(allPerf.filter(r=>(!curBrand||r.brand===curBrand)&&r.tanggal&&r.tanggal.startsWith(curMonth)));
    momFull = curMonth < new Date().toISOString().slice(0,7);   // bulan sudah lewat = komplit
    momCutoff = momFull ? (scope.length?99:0) : Math.max(0,...scope.map(r=>+r.tanggal.slice(8,10)));
    const[cy,cm]=curMonth.split('-').map(Number);
    const pd=new Date(cy,cm-2,1);                       // bulan kalender sebelumnya
    prevMonth=`${pd.getFullYear()}-${String(pd.getMonth()+1).padStart(2,'0')}`;
    momNote = momCutoff>0 ? `▲▼ = perubahan vs ${mlabelShort(prevMonth)} — ${momFull ? 'dibandingkan bulan penuh' : `dibandingkan sama-sama ${momCutoff} hari pertama`}. Lihat metrik kualitas (AOV, CTR/Klik-Vw, CTOR, Engagement), bukan cuma GMV.` : '';
  }
  // Agregat host di 1 bulan, dibatasi hari 1..maxDay (ikut brand & platform aktif)
  function sumWindow(email, month, maxDay){
    const rows=platFilter(allPerf).filter(r=> r.host_email===email && r.tanggal && r.tanggal.startsWith(month)
        && (+r.tanggal.slice(8,10))<=maxDay && (!curBrand||r.brand===curBrand));
    if(!rows.length) return null;
    return rows.reduce((a,r)=>{a.gmv+=+r.gmv||0;a.pembeli+=+r.pembeli||0;a.vw+=+r.viewers||0;a.imp+=+r.impresi||0;a.kl+=+r.klik_produk||0;a.likes+=+r.likes||0;a.kom+=+r.komentar||0;return a;},{gmv:0,pembeli:0,vw:0,imp:0,kl:0,likes:0,kom:0});
  }
  // metrik kualitas dari agregat window (semua "higher is better")
  function qmetrics(s){ return s? {
    aov:  s.pembeli? s.gmv/s.pembeli : 0,
    ctr:  s.imp? s.kl/s.imp : 0,
    kpv:  s.vw? s.kl/s.vw : 0,
    ctor: s.kl? s.pembeli/s.kl : 0,
    eng:  s.vw? (s.likes+s.kom)/s.vw : 0,
  } : null; }
  // badge delta kecil — hijau naik, merah turun (kosong kalau data kurang)
  function momDelta(curVal, prevVal){
    if(!showMoM || momCutoff<=0) return '';
    return deltaSpan(curVal, prevVal);
  }

  box.innerHTML=`
    ${platToggle()}
    <div class="filter-row">
      <select id="bFilter" onchange="DASH_BRAND=this.value; renderDash()"><option value="">Semua brand</option>
        ${BRANDS.map(b=>`<option value="${b}" ${curBrand===b?'selected':''}>${b}</option>`).join('')}
      </select>
      <select id="mFilter" onchange="DASH_MONTH=this.value; renderDash()">${monthOpts}</select>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-l">Total GMV</div><div class="stat-v good">${rp(tot.gmv)}</div></div>
      <div class="stat"><div class="stat-l">Total Sesi</div><div class="stat-v">${filtered.length}</div></div>
      <div class="stat"><div class="stat-l">Total Pembeli</div><div class="stat-v">${tot.pembeli}</div></div>
      <div class="stat"><div class="stat-l">AOV Tim</div><div class="stat-v">${rp(dT.aov)}</div></div>
    </div>
    <div class="section-title">Performa per Host</div>
    ${showMoM&&momNote?`<div style="font-size:11px;color:var(--text3);margin:-6px 0 10px">${momNote}</div>`:''}
    <div id="hostCards"></div>
    <div class="chart-card"><h3>Perbandingan GMV antar host</h3><div class="chart-wrap"><canvas id="chCompare"></canvas></div></div>`;

  // host cards
  const hosts = (curBrand? ALL_HOSTS.filter(h=>h.brands.includes(curBrand)) : ALL_HOSTS).filter(h=>h.active || filtered.some(r=>r.host_email===h.email));
  const cards = hosts.map(h=>{
    const hd=filtered.filter(r=>r.host_email===h.email);
    if(!hd.length) return `<div class="tbl-wrap" style="padding:14px 16px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:10px"><div class="h-ava" style="background:${h.color||'var(--accent)'}">${h.name[0]}</div><div><b>${h.name}</b> <span class="badge">${curBrand||h.brands.join(' · ')}</span><div style="color:var(--text3);font-size:12px;margin-top:2px">Belum ada data</div></div></div></div>`;
    const g=hd.reduce((a,r)=>a+(+r.gmv||0),0);
    const p=hd.reduce((a,r)=>a+(+r.pembeli||0),0);
    const it=hd.reduce((a,r)=>a+(+r.items||0),0);
    const vw=hd.reduce((a,r)=>a+(+r.viewers||0),0);
    const imp=hd.reduce((a,r)=>a+(+r.impresi||0),0);
    const kl=hd.reduce((a,r)=>a+(+r.klik_produk||0),0);
    const lk=hd.reduce((a,r)=>a+(+r.likes||0),0);
    const km=hd.reduce((a,r)=>a+(+r.komentar||0),0);
    const dd=derive({gmv:g,pembeli:p,impresi:imp,klik_produk:kl,viewers:vw,likes:lk,komentar:km,durasi_menit:0});
    // agregat bulan lalu (periode hari yang sama) — dasar semua delta
    const prevS = (showMoM && momCutoff>0) ? sumWindow(h.email, prevMonth, momCutoff) : null;
    const prevQ = qmetrics(prevS);
    // badge perubahan GMV vs bulan lalu (periode hari yang sama)
    let momBadge='';
    if(showMoM && momCutoff>0){
      const prevG = prevS? prevS.gmv : 0;
      if(prevG>0){
        const d=Math.round((g/prevG-1)*100);
        const col=d>0?'var(--good)':(d<0?'var(--bad)':'var(--text3)');
        const arr=d>0?'▲':(d<0?'▼':'');
        momBadge=`<span title="vs ${mlabelShort(prevMonth)} (${momFull?'bulan penuh':`1–${momCutoff}`}): ${rp(prevG)}" style="font-size:12px;font-weight:700;color:${col}">${(d>=0?'+':'')+d}% ${arr}</span>`;
      } else {
        momBadge=`<span style="font-size:11px;color:var(--text3)" title="${mlabelShort(prevMonth)} belum ada data di rentang ini">bln lalu —</span>`;
      }
    }
    // delta per metrik kualitas
    const dAov  = momDelta(dd.aov,             prevQ?prevQ.aov:null);
    const dCtr  = momDelta(dd.ctr,             prevQ?prevQ.ctr:null);
    const dKpv  = momDelta(dd.klik_per_viewer, prevQ?prevQ.kpv:null);
    const dCtor = momDelta(dd.ctor,            prevQ?prevQ.ctor:null);
    const dEng  = momDelta(dd.eng,             prevQ?prevQ.eng:null);
    const funnel = PLAT_VIEW==='shopee'
      ? `<span>Klik/Vw ${vw&&kl?pct(dd.klik_per_viewer):'—'}${dKpv}</span><span>CTOR ${kl?pct(dd.ctor):'—'}${dCtor}</span><span>Eng ${vw?pct(dd.eng):'—'}${dEng}</span>`
      : PLAT_VIEW==='tiktok'
      ? `<span>CTR ${imp?pct(dd.ctr):'—'}${dCtr}</span><span>CTOR ${kl?pct(dd.ctor):'—'}${dCtor}</span><span>Eng ${vw?pct(dd.eng):'—'}${dEng}</span>`
      : ``;
    return `<div class="tbl-wrap" style="padding:14px 16px;margin-bottom:8px;cursor:pointer" onclick="drilldown('${h.email}','${h.name}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:10px"><div class="h-ava" style="background:${h.color||'var(--accent)'}">${h.name[0]}</div><div><b>${h.name}</b> <span class="badge">${curBrand||h.brands.join(' · ')}</span>${h.active?'':' <span style="font-size:10px;color:var(--text3)">(nonaktif)</span>'}</div></div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:600;color:var(--good)">${rp(g)}</div>
          ${momBadge?`<div style="margin-top:2px">${momBadge}</div>`:''}
        </div>
      </div>
      <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--text2);flex-wrap:wrap">
        <span>${hd.length} sesi</span><span>${p.toLocaleString('id-ID')} pembeli</span><span>${it.toLocaleString('id-ID')} items</span><span>${vw.toLocaleString('id-ID')} viewers${momDelta(vw, prevS?prevS.vw:null)}</span><span>AOV ${rp(dd.aov)}${dAov}</span>${funnel}
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px">Klik untuk lihat detail lengkap →</div>
    </div>`;
  }).join('');
  document.getElementById('hostCards').innerHTML=cards;

  // compare chart
  destroyCharts();
  const cmpHosts=hosts.map(h=>({h, g:filtered.filter(r=>r.host_email===h.email).reduce((a,r)=>a+(+r.gmv||0),0)}));
  charts.cmp=new Chart(document.getElementById('chCompare'),{type:'bar',data:{
    labels:cmpHosts.map(x=>x.h.name),
    datasets:[{data:cmpHosts.map(x=>x.g),backgroundColor:cmpHosts.map(x=>x.h.color),borderRadius:5}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'Rp'+(v/1e6).toFixed(1)+'jt',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'}},x:{grid:{display:false}}}}});
}

// ════════════════════════════════════
// BANDINGKAN HOST (per brand, jumlah host dinamis, pilih bulan)
// ════════════════════════════════════
function renderCompare(){
  const box=document.getElementById('compareContent');
  if(!box) return;

  const curBrand=document.getElementById('cmpBrand')?.value || BRANDS[0] || '';

  const months=[...new Set(allPerf.filter(r=>r.brand===curBrand&&r.tanggal).map(r=>r.tanggal.slice(0,7)))].sort().reverse();
  const thisMonth=new Date().toISOString().slice(0,7);
  const savedM=document.getElementById('cmpMonth')?.value;
  let curMonth;
  if(savedM===undefined) curMonth = months.includes(thisMonth)?thisMonth:(months[0]||'');
  else if(savedM!=='' && !months.includes(savedM)) curMonth = months.includes(thisMonth)?thisMonth:(months[0]||'');
  else curMonth = savedM;

  const monthOpts=`<option value="" ${curMonth===''?'selected':''}>Semua bulan (akumulasi)</option>`+
    months.map(m=>{const[y,mo]=m.split('-');return `<option value="${m}" ${m===curMonth?'selected':''}>${new Date(y,mo-1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`}).join('');

  const periodLbl = curMonth==='' ? 'Akumulasi semua bulan' : (()=>{const[y,mo]=curMonth.split('-');return new Date(y,mo-1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})})();

  const rowsData=platFilter(allPerf.filter(r=>r.brand===curBrand && (!curMonth || (r.tanggal&&r.tanggal.startsWith(curMonth)))));
  const hosts=ALL_HOSTS.filter(h=>h.brands.includes(curBrand)).filter(h=>h.active || rowsData.some(r=>r.host_email===h.email));

  const hd=hosts.map(h=>{
    const hr=rowsData.filter(r=>r.host_email===h.email);
    if(!hr.length) return {h, none:true};
    const s=hr.reduce((a,r)=>{a.gmv+=+r.gmv||0;a.pembeli+=+r.pembeli||0;a.items+=+r.items||0;a.vw+=+r.viewers||0;a.imp+=+r.impresi||0;a.kl+=+r.klik_produk||0;a.likes+=+r.likes||0;a.kom+=+r.komentar||0;return a;},{gmv:0,pembeli:0,items:0,vw:0,imp:0,kl:0,likes:0,kom:0});
    const d=derive({gmv:s.gmv,pembeli:s.pembeli,impresi:s.imp,klik_produk:s.kl,viewers:s.vw,likes:s.likes,komentar:s.kom,durasi_menit:0});
    return {h, none:false, sesi:hr.length, gmv:s.gmv, pembeli:s.pembeli, items:s.items, viewers:s.vw,
            aov:d.aov, ctr:d.ctr, ctor:d.ctor, eng:d.eng, kpv:d.klik_per_viewer};
  });

  const withData=hd.filter(x=>!x.none);

  let html=`
    ${platToggle()}
    <div class="filter-row">
      <select id="cmpBrand" onchange="renderCompare()">
        ${BRANDS.map(b=>`<option value="${b}" ${curBrand===b?'selected':''}>${b}</option>`).join('')}
      </select>
      <select id="cmpMonth" onchange="renderCompare()">${monthOpts}</select>
    </div>
    <div class="section-title">Bandingkan Host — ${curBrand}</div>
    <div style="font-size:12px;color:var(--text3);margin:-6px 0 12px">${periodLbl}</div>`;

  if(!withData.length){
    box.innerHTML=html+`<p class="empty">Belum ada data untuk ${curBrand} di periode ini.</p>`;
    if(charts.ctor){try{charts.ctor.destroy()}catch(e){}}
    return;
  }

  const bestOf=key=>Math.max(0,...withData.map(x=>+x[key]||0));

  function qCell(x,key,fmt){
    if(x.none) return `<td class="num" style="color:var(--text3)">—</td>`;
    const v=+x[key]||0;
    if(v<=0) return `<td class="num" style="color:var(--text3)">—</td>`;
    const best=bestOf(key);
    if(v===best) return `<td class="num" style="font-weight:700;color:var(--good)">${fmt(v)} <span style="font-size:10px">▲ tertinggi</span></td>`;
    const delta=Math.round((v/best-1)*100);
    return `<td class="num">${fmt(v)} <span style="font-size:11px;color:var(--warn)">${delta}%</span></td>`;
  }
  function vCell(x,key,fmt){
    if(x.none) return `<td class="num" style="color:var(--text3)">—</td>`;
    return `<td class="num">${fmt(+x[key]||0)}</td>`;
  }

  const head=`<th>Metrik</th>`+hd.map(x=>`<th class="num">${x.h.name}${x.none?' <span style="font-weight:400;color:var(--text3);font-size:10px">(no data)</span>':''}</th>`).join('');

  const volRows=[
    `<tr><td><b>GMV</b> <span style="font-size:10px;color:var(--text3)">volume · dipengaruhi jam tayang</span></td>${hd.map(x=>vCell(x,'gmv',rp)).join('')}</tr>`,
    `<tr><td>Sesi <span style="font-size:10px;color:var(--text3)">volume</span></td>${hd.map(x=>vCell(x,'sesi',v=>v)).join('')}</tr>`,
    `<tr><td>Pembeli <span style="font-size:10px;color:var(--text3)">volume</span></td>${hd.map(x=>vCell(x,'pembeli',v=>(v||0).toLocaleString('id-ID'))).join('')}</tr>`,
    `<tr style="border-top:2px solid var(--border2)"><td><b>AOV</b> <span style="font-size:10px;color:var(--text3)">kualitas basket</span></td>${hd.map(x=>qCell(x,'aov',rp)).join('')}</tr>`,
  ];
  const funnelRows = PLAT_VIEW==='all' ? [] : (PLAT_VIEW==='shopee' ? [
    `<tr><td><b>Klik/Viewer</b> <span style="font-size:10px;color:var(--text3)">daya tarik (Shopee)</span></td>${hd.map(x=>qCell(x,'kpv',pct)).join('')}</tr>`,
    `<tr><td><b>CTOR</b> <span style="font-size:10px;color:var(--text3)">closing</span></td>${hd.map(x=>qCell(x,'ctor',pct)).join('')}</tr>`,
    `<tr><td><b>Engagement</b> <span style="font-size:10px;color:var(--text3)">interaktivitas</span></td>${hd.map(x=>qCell(x,'eng',pct)).join('')}</tr>`,
  ] : [
    `<tr><td><b>CTR</b> <span style="font-size:10px;color:var(--text3)">daya tarik</span></td>${hd.map(x=>qCell(x,'ctr',pct)).join('')}</tr>`,
    `<tr><td><b>CTOR</b> <span style="font-size:10px;color:var(--text3)">closing</span></td>${hd.map(x=>qCell(x,'ctor',pct)).join('')}</tr>`,
    `<tr><td><b>Engagement</b> <span style="font-size:10px;color:var(--text3)">interaktivitas</span></td>${hd.map(x=>qCell(x,'eng',pct)).join('')}</tr>`,
  ]);
  const rowsHtml=[...volRows,...funnelRows].join('');

  html+=`
    <div class="tbl-wrap"><div class="tbl-scroll"><table>
      <thead><tr>${head}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div></div>
    <div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5">
      ▲ = nilai terbaik di barisnya. Persentase = selisih relatif terhadap yang tertinggi.<br>
      ${PLAT_VIEW==='all'
        ? 'Mode Gabungan cuma adu GMV + volume + AOV — metrik funnel (CTR/Klik-Viewer/CTOR) tidak dicampur lintas platform. Pilih TikTok atau Shopee untuk lihat funnel.'
        : 'Penilaian "siapa lebih jago" pakai metrik kualitas (AOV, '+(PLAT_VIEW==='shopee'?'Klik/Viewer':'CTR')+', CTOR, Engagement), bukan GMV mentah — karena GMV besar sering cuma efek jam tayang ramai.'}
    </div>
    ${PLAT_VIEW==='all' ? '' : `<div class="chart-card" style="margin-top:1.1rem"><h3>CTOR — kemampuan closing (%)</h3><div class="chart-wrap sm"><canvas id="chCtor"></canvas></div></div>`}`;

  box.innerHTML=html;

  if(charts.ctor){try{charts.ctor.destroy()}catch(e){}}
  const cd=PLAT_VIEW==='all'? [] : withData.filter(x=>(+x.ctor||0)>0);
  if(cd.length && document.getElementById('chCtor')){
    charts.ctor=new Chart(document.getElementById('chCtor'),{type:'bar',data:{
      labels:cd.map(x=>x.h.name),
      datasets:[{data:cd.map(x=>(+x.ctor||0)*100),backgroundColor:cd.map(x=>x.h.color),borderRadius:5}]
    },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y.toFixed(2)+'%'}}},scales:{y:{ticks:{callback:v=>v+'%',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'}},x:{grid:{display:false}}}}});
  }
}

// ════════════════════════════════════
// TREN BRAND (bulan ke bulan, per brand, bulan berjalan dilabeli)
// ════════════════════════════════════
const TREND_METRICS={
  gmv: {label:'GMV',        type:'money', val:s=>s.gmv},
  aov: {label:'AOV',        type:'money', val:s=>s.pembeli? s.gmv/s.pembeli : 0},
  ctr: {label:'CTR',        type:'pct',   val:s=>s.imp? s.kl/s.imp : 0},
  kpv: {label:'Klik/Viewer',type:'pct',   val:s=>s.vw? s.kl/s.vw : 0},
  ctor:{label:'CTOR',       type:'pct',   val:s=>s.kl? s.pembeli/s.kl : 0},
  eng: {label:'Engagement', type:'pct',   val:s=>s.vw? (s.likes+s.kom)/s.vw : 0},
};

function renderTrend(){
  const TREND_BRANDS=BRANDS.map(b=>({name:b, color:brandColor(b)}));
  const box=document.getElementById('trendContent');
  if(!box) return;

  // metrik yang valid per platform
  const metricKeysFor = PLAT_VIEW==='shopee' ? ['gmv','aov','kpv','ctor','eng']
                      : PLAT_VIEW==='all'    ? ['gmv','aov']
                      : ['gmv','aov','ctr','ctor','eng'];
  let metricKey=document.getElementById('trMetric')?.value || 'gmv';
  if(!metricKeysFor.includes(metricKey)) metricKey='gmv';
  const M=TREND_METRICS[metricKey];
  const fmt = M.type==='money' ? rp : pct;

  // all months across all brands (dalam platform view), ascending
  const months=[...new Set(platFilter(allPerf).filter(r=>r.tanggal).map(r=>r.tanggal.slice(0,7)))].sort();
  const thisMonth=new Date().toISOString().slice(0,7);
  const berjalanIdx=months.indexOf(thisMonth);          // -1 if current month has no data yet
  const labels=months.map(m=>{const[y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('id-ID',{month:'short',year:'2-digit'})});
  const berjalanLbl = berjalanIdx>=0 ? (()=>{const[y,mo]=thisMonth.split('-');return new Date(y,mo-1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})})() : null;

  // sums per brand per month (optional day cutoff for MTD)
  function brandMonth(brand,m){ return brandPeriod(brand,m,99); }
  function brandPeriod(brand,m,maxDay){
    const r=platFilter(allPerf).filter(x=>x.brand===brand && x.tanggal && x.tanggal.startsWith(m) && (+x.tanggal.slice(8,10))<=maxDay);
    if(!r.length) return null;
    return r.reduce((a,x)=>{a.gmv+=+x.gmv||0;a.pembeli+=+x.pembeli||0;a.vw+=+x.viewers||0;a.imp+=+x.impresi||0;a.kl+=+x.klik_produk||0;a.likes+=+x.likes||0;a.kom+=+x.komentar||0;return a;},{gmv:0,pembeli:0,vw:0,imp:0,kl:0,likes:0,kom:0});
  }

  const series=TREND_BRANDS.map(b=>{
    const data=months.map(m=>{const s=brandMonth(b.name,m); if(!s) return null; const v=M.val(s); return (M.type==='pct'&&v<=0)?null:v;});
    return {b, data};
  });

  const mlabel=m=>{const[y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('id-ID',{month:'short',year:'2-digit'})};

  // Badge: kalau ada bulan berjalan -> MTD (same-period) vs bulan komplit terakhir.
  // Cutoff = tanggal data terakhir di bulan berjalan. Chart tetap pakai total bulan penuh.
  const completed=months.filter(m=>m!==thisMonth);
  const hasBerjalan=months.includes(thisMonth);
  let cutoffDay=0;
  if(hasBerjalan){
    cutoffDay=Math.max(0,...allPerf.filter(r=>r.tanggal&&r.tanggal.startsWith(thisMonth)).map(r=>+r.tanggal.slice(8,10)));
  }
  let cmpM,baseM,winDay,badgeNote;
  if(hasBerjalan && cutoffDay>0 && completed.length>=1){
    cmpM=thisMonth; baseM=completed[completed.length-1]; winDay=cutoffDay;
    badgeNote=`Pacing ${mlabel(baseM)} (1–${winDay}) → ${mlabel(cmpM)} (1–${winDay}) · sama-sama ${winDay} hari pertama`;
  } else {
    cmpM=completed[completed.length-1]; baseM=completed[completed.length-2]; winDay=99;
    badgeNote=baseM?`Perubahan ${mlabel(baseM)} → ${mlabel(cmpM)} (bulan komplit terakhir)`:'';
  }
  const badges=TREND_BRANDS.map(b=>{
    if(!cmpM||!baseM) return {b, txt:'butuh 2 bulan', dir:0};
    const sC=brandPeriod(b.name,cmpM,winDay), sB=brandPeriod(b.name,baseM,winDay);
    const vC=sC?M.val(sC):null, vB=sB?M.val(sB):null;
    if(vC==null||vB==null||vB<=0) return {b, txt:'data kurang', dir:0};
    const d=Math.round((vC/vB-1)*100);
    return {b, txt:(d>=0?'+':'')+d+'%', dir:Math.sign(d)};
  });

  let html=`
    ${platToggle()}
    <div class="filter-row">
      <select id="trMetric" onchange="renderTrend()">
        ${metricKeysFor.map(k=>`<option value="${k}" ${k===metricKey?'selected':''}>${TREND_METRICS[k].label}</option>`).join('')}
      </select>
    </div>
    <div class="section-title">Tren ${M.label} per Brand · ${PLAT_LABEL[PLAT_VIEW]}</div>`;

  if(months.length<2){
    box.innerHTML=html+`<p class="empty">Butuh minimal 2 bulan data untuk lihat tren.</p>`;
    if(charts.trend){try{charts.trend.destroy()}catch(e){}}
    return;
  }

  // MoM badges
  html+=`<div style="font-size:11px;color:var(--text3);margin:-4px 0 8px">${badgeNote}</div>
    <div class="stats" style="margin-bottom:1rem">
    ${badges.map(x=>{
      const col = x.dir>0?'var(--good)':(x.dir<0?'#f87171':'var(--text3)');
      const arr = x.dir>0?'▲':(x.dir<0?'▼':'');
      return `<div class="stat"><div class="stat-l">${x.b.name}</div><div class="stat-v" style="color:${col};font-size:18px">${x.txt} ${arr}</div></div>`;
    }).join('')}
    </div>
    <div class="chart-card"><h3>${M.label} bulan ke bulan</h3><div class="chart-wrap"><canvas id="chTrend"></canvas></div></div>`;

  if(berjalanLbl){
    html+=`<div style="font-size:11px;color:var(--warn);margin-top:8px">${berjalanLbl} masih berjalan — titik terakhir (garis putus-putus) belum lengkap, jadi tidak dipakai di perhitungan perubahan %.</div>`;
  }

  box.innerHTML=html;

  // line chart
  if(charts.trend){try{charts.trend.destroy()}catch(e){}}
  charts.trend=new Chart(document.getElementById('chTrend'),{
    type:'line',
    data:{labels, datasets: series.map(s=>({
      label:s.b.name,
      data:s.data,
      borderColor:s.b.color,
      backgroundColor:s.b.color+'22',

async function saveEditSesi(){
  if(_editId==null) return;
  const v=id=>document.getElementById(id).value;
  const n=id=>+document.getElementById(id).value||0;
  if(!v('e_tanggal')){ alert('Tanggal tidak boleh kosong.'); return; }
  let screenshot_url = _editSSRemove ? null : _editSSUrl;
  const newFile=document.getElementById('e_ss_file')?.files[0];
  if(newFile){
    try{ showToast('Mengupload screenshot...','info'); screenshot_url=await uploadScreenshot(newFile, ME||'leader', v('e_tanggal'), v('e_sesi')); }
    catch(err){ showToast('Gagal upload screenshot: '+(err.message||err),'error'); return; }
  }
  const payload={
    tanggal:v('e_tanggal'), sesi:+v('e_sesi'),
    brand:v('e_brand')||null,
    platform:v('e_platform')||'tiktok',
    gmv:intVal('e_gmv'), pembeli:intVal('e_pembeli'), items:intVal('e_items'),
    viewers:intVal('e_viewers'), impresi:intVal('e_impresi'), klik_produk:intVal('e_klik'), atc:intVal('e_atc'),
    avg_view_dur:n('e_avg'), durasi_menit:n('e_durasi_jam')*60+n('e_durasi_min'),
    followers_baru:intVal('e_foll'), likes:intVal('e_likes'), komentar:intVal('e_kom'),
    screenshot_url,
  };
  const {data,error}=await sb.from('live_performance').update(payload).eq('id',_editId).select();
  if(error){ showToast('Gagal menyimpan: '+error.message,'error'); return; }

let pendingRows=[];
let lastRawRows=null;
function reprocessIfLoaded(){ if(lastRawRows) routeImport(lastRawRows); }
function parseFile(file){
  const reader=new FileReader();
  const isCsv=/\.csv$/i.test(file.name||'');
  reader.onload=e=>{
    try{
      let rows;
      if(isCsv){
        rows=parseCSV(String(e.target.result));
      }else{
        const wb=XLSX.read(e.target.result,{type:'array'});
        // find the input sheet (first sheet with 'Input' or just first)
        let sheetName=wb.SheetNames.find(n=>n.includes('Input'))||wb.SheetNames[0];
        const ws=wb.Sheets[sheetName];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      }
      routeImport(rows);
    }catch(err){ showToast('Gagal baca file: '+err.message,'error'); }
  };
  if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}

// ── Router: deteksi format Shopee vs TikTok-tracker ──
function isShopeeRows(rows){
  return rows.some(r=>r&&r.some(c=>{const s=String(c).trim(); return s==='Sales(Confirmed Order)'||s==='Start Time';}));
}
function routeImport(rows){
  lastRawRows=rows;
  if(isShopeeRows(rows)) processImportShopee(rows);
  else processImport(rows);
}

// ── CSV parser (handle BOM, quoted fields, koma di dalam tanda kutip, CRLF) ──
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){ /* skip */ }
      else cur+=c;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
// Angka format Indonesia: titik=ribuan, koma=desimal. Buang 'Rp'. "Rp594.177"→594177, "179.693,65"→179693.65
function parseRpID(v){
  if(v==null) return 0;
  let s=String(v).trim().replace(/rp/i,'').replace(/\s/g,'');
  if(s===''||s==='-') return 0;
  s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s.replace(/[^\d.-]/g,''));
  return isNaN(n)?0:n;
}
// "31-05-2026 18:25" → {tanggal:'2026-05-31', mins: 1105}
function parseShopeeStart(v){
  const m=String(v||'').trim().match(/(\d{1,2})-(\d{1,2})-(\d{4})\s+(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return { tanggal:`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`, mins:(+m[4])*60+(+m[5]) };
}
// "HH:MM:SS" → detik
function hmsToSec(v){
  const m=String(v||'').match(/(\d{1,2}):(\d{2}):(\d{2})/);
  return m? (+m[1])*3600+(+m[2])*60+(+m[3]) : 0;
}

function timeToMin(t){
  if(!t)return null;
  const m=String(t).match(/(\d{1,2}):(\d{2})/);
  if(!m)return null;
  return (+m[1])*60+(+m[2]);
}
function assignSesi(mins){
  if(mins<11*60)return 1;
  if(mins<14*60)return 2;
  if(mins<18*60)return 3;
  return 4;
}
function normDate(d){
  if(!d)return null;
  // accept 2026-05-01 or other; try Date parse
  const s=String(d).trim();
  let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const dt=new Date(s); if(!isNaN(dt)) return dt.toISOString().slice(0,10);
  return null;
}

function processImport(rows){
  lastRawRows=rows;
  const brand=document.getElementById('impBrand').value;
  const pagiEmail=document.getElementById('impPagi').value;
  const soreEmail=document.getElementById('impSore').value;
  const pagi=ALL_HOSTS.find(h=>h.email===pagiEmail), sore=ALL_HOSTS.find(h=>h.email===soreEmail);

  // find header row: row containing 'Tanggal' and 'Waktu'
  let hi=rows.findIndex(r=>r&&r.some(c=>String(c).trim()==='Tanggal')&&r.some(c=>String(c).includes('Waktu')));
  if(hi<0){ showToast('Format tidak dikenali (tidak ada kolom Tanggal/Waktu).','error'); return; }
  const head=rows[hi].map(c=>String(c).replace(/\n/g,' ').trim());
  const col=name=>head.findIndex(h=>h.toLowerCase().includes(name.toLowerCase()));
  const ci={ tgl:col('Tanggal'), wkt:col('Waktu'), dur:col('Durasi'), gmv:col('GMV'), pemb:col('Pembeli'),
    items:col('Items'), view:col('Viewers'), imp:col('Impresi'), klik:col('Klik'),
    avg:col('Avg Watch'), foll:col('Pengikut'), likes:col('Likes'), kom:col('Komentar') };

  const num=v=>{ if(v==null||v==='')return 0; const n=parseFloat(String(v).replace(/[^\d.-]/g,'')); return isNaN(n)?0:n; };
  pendingRows=[];
  let dropped=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r[ci.tgl]||!r[ci.wkt])continue;
    const tanggal=normDate(r[ci.tgl]); const mins=timeToMin(r[ci.wkt]);
    if(!tanggal||mins==null)continue;
    const sesi=assignSesi(mins);
    const who = sesi<=2? pagi : sore;
    const gmv=num(r[ci.gmv]), viewers=num(r[ci.view]);
    if(gmv===0 && viewers===0){ dropped++; continue; }
    pendingRows.push({
      host:who.name, brand, host_email:who.email, tanggal, sesi, platform:'tiktok',
      gmv, pembeli:Math.round(num(r[ci.pemb])), items:Math.round(num(r[ci.items])),
      viewers:Math.round(viewers), impresi:Math.round(num(r[ci.imp])), klik_produk:Math.round(num(r[ci.klik])),
      avg_view_dur:Math.round(num(r[ci.avg])), durasi_menit:Math.round(num(r[ci.dur])),
      followers_baru:Math.round(num(r[ci.foll])), likes:Math.round(num(r[ci.likes])), komentar:Math.round(num(r[ci.kom])),
    });
  }
  // preview
  const byHost={};
  pendingRows.forEach(p=>{byHost[p.host]=(byHost[p.host]||0)+1;});
  const summary=Object.entries(byHost).map(([h,c])=>`${h}: ${c} sesi`).join(' · ');
  document.getElementById('impPreview').innerHTML=`
    <div style="margin-top:16px;padding:14px;background:var(--goodbg);border:1px solid var(--goodbd);border-radius:var(--r)">
      <div style="font-weight:600;color:var(--good);margin-bottom:4px">${pendingRows.length} sesi siap diimport (${dropped} dilewati)</div>
      <div style="font-size:12px;color:var(--text2)">${summary}</div>
    </div>
    <div class="tbl-wrap" style="margin-top:12px"><div class="tbl-scroll"><table>
      <thead><tr><th>Tgl</th><th>Host</th><th>Sesi</th><th class="num">GMV</th><th class="num">Viewers</th><th class="num">Klik</th></tr></thead>
      <tbody>${pendingRows.slice(0,8).map(p=>`<tr><td>${fmtTgl(p.tanggal)}</td><td>${p.host}</td><td>S${p.sesi}</td><td class="num">${rp(p.gmv)}</td><td class="num">${p.viewers.toLocaleString('id-ID')}</td><td class="num">${p.klik_produk}</td></tr>`).join('')}</tbody>
    </table></div></div>
    ${pendingRows.length>8?`<div style="font-size:12px;color:var(--text3);margin:6px 0 12px">…dan ${pendingRows.length-8} sesi lainnya</div>`:'<div style="height:12px"></div>'}
    <button class="btn-accent" onclick="confirmImport()">Import ${pendingRows.length} Sesi ke Database</button>`;
}

// ── Importer Shopee (CSV Confirmed Order, per-live) ──
function processImportShopee(rows){
  const brand=document.getElementById('impBrand').value;
  const pagiEmail=document.getElementById('impPagi').value;
  const soreEmail=document.getElementById('impSore').value;
  const pagi=ALL_HOSTS.find(h=>h.email===pagiEmail), sore=ALL_HOSTS.find(h=>h.email===soreEmail);

  // header row: ada 'Start Time' & 'Sales(Confirmed Order)'
  let hi=rows.findIndex(r=>r&&r.some(c=>String(c).trim()==='Start Time')&&r.some(c=>String(c).trim()==='Sales(Confirmed Order)'));
  if(hi<0){ showToast('Format Shopee tidak dikenali (header Start Time / Sales(Confirmed Order) tidak ada).','error'); return; }
  const head=rows[hi].map(c=>String(c).trim());
  // exact match dulu (penting: Confirmed bukan Placed, Viewers bukan Engaged Viewers)
  const col=nm=>head.findIndex(h=>h.toLowerCase()===nm.toLowerCase());
  const ci={
    start: col('Start Time'),
    dur:   col('Duration'),
    kom:   col('Comments'),
    atc:   col('ATC'),
    avg:   col('Avg. Viewing Duration'),
    view:  col('Viewers'),
    pemb:  col('Orders(Confirmed Order)'),
    items: col('Items Sold(Confirmed Order)'),
    gmv:   col('Sales(Confirmed Order)'),
  };
  if(ci.start<0||ci.gmv<0){ showToast('Kolom Start Time / Sales(Confirmed Order) tidak ketemu.','error'); return; }

  pendingRows=[];
  let dropped=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r[ci.start])continue;
    const st=parseShopeeStart(r[ci.start]);
    if(!st)continue;
    const sesi=assignSesi(st.mins);
    const who=sesi<=2? pagi : sore;
    const gmv=parseRpID(r[ci.gmv]);
    const viewers=Math.round(parseRpID(r[ci.view]));
    if(gmv===0 && viewers===0){ dropped++; continue; }
    pendingRows.push({
      host:who.name, brand, host_email:who.email, tanggal:st.tanggal, sesi, platform:'shopee',
      gmv, pembeli:Math.round(parseRpID(r[ci.pemb])), items:Math.round(parseRpID(r[ci.items])),
      viewers, komentar:Math.round(parseRpID(r[ci.kom])), atc:ci.atc>=0?Math.round(parseRpID(r[ci.atc])):0,
      avg_view_dur:hmsToSec(r[ci.avg]), durasi_menit:Math.round(hmsToSec(r[ci.dur])/60),
      impresi:0, klik_produk:0, likes:0, followers_baru:0,
    });
  }

  const byHost={};
  pendingRows.forEach(p=>{byHost[p.host]=(byHost[p.host]||0)+1;});
  const summary=Object.entries(byHost).map(([h,c])=>`${h}: ${c} sesi`).join(' · ');
  document.getElementById('impPreview').innerHTML=`
    <div style="margin-top:16px;padding:14px;background:var(--goodbg);border:1px solid var(--goodbd);border-radius:var(--r)">
      <div style="font-weight:600;color:var(--good);margin-bottom:4px">${pendingRows.length} sesi Shopee siap diimport (${dropped} dilewati) <span class="badge"><span class="gel-dot" style="--gel:var(--shopee);margin-right:0"></span>Shopee</span></div>
      <div style="font-size:12px;color:var(--text2)">${summary||'—'}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Impresi/Klik/Likes/Followers tidak ada di export Shopee → diisi 0. GMV pakai Confirmed Order.</div>
    </div>
    <div class="tbl-wrap" style="margin-top:12px"><div class="tbl-scroll"><table>
      <thead><tr><th>Tgl</th><th>Host</th><th>Sesi</th><th class="num">GMV</th><th class="num">Pembeli</th><th class="num">Viewers</th><th class="num">ATC</th></tr></thead>
      <tbody>${pendingRows.slice(0,8).map(p=>`<tr><td>${fmtTgl(p.tanggal)}</td><td>${p.host}</td><td>S${p.sesi}</td><td class="num">${rp(p.gmv)}</td><td class="num">${p.pembeli}</td><td class="num">${p.viewers.toLocaleString('id-ID')}</td><td class="num">${p.atc}</td></tr>`).join('')}</tbody>
    </table></div></div>
    ${pendingRows.length>8?`<div style="font-size:12px;color:var(--text3);margin:6px 0 12px">…dan ${pendingRows.length-8} sesi lainnya</div>`:'<div style="height:12px"></div>'}
    ${pendingRows.length?`<button class="btn-accent" onclick="confirmImport()">Import ${pendingRows.length} Sesi Shopee ke Database</button>`:''}`;
}

async function confirmImport(){
  if(!pendingRows.length)return;
  if(!confirm(`Import ${pendingRows.length} sesi? Pastikan data belum pernah diimport sebelumnya (untuk hindari duplikat).`))return;
  showToast('Mengimport...','info');
  // insert in chunks of 50
  for(let i=0;i<pendingRows.length;i+=50){
    const chunk=pendingRows.slice(i,i+50);
    const {error}=await sb.from('live_performance').insert(chunk);
    if(error){showToast('Gagal di baris '+i+': '+error.message,'error');return;}
  }
  showToast(`Berhasil import ${pendingRows.length} sesi!`,'success');
  document.getElementById('impPreview').innerHTML='';
  pendingRows=[];
  loadDash();
}

// ── Libur & Kelengkapan Data ──
let LIBUR_MONTH=null;
function hostNameByEmail(e){ const h=ALL_HOSTS.find(x=>x.email===e); return h?h.name:e; }
function renderLibur(){
  const box=document.getElementById('liburContent'); if(!box) return;
  const isLeader=ROLE==='leader';
  const thisMonth=new Date().toISOString().slice(0,7);
  if(LIBUR_MONTH===null) LIBUR_MONTH=thisMonth;
  const hosts=[...ALL_HOSTS.filter(h=>h.active)].sort((a,b)=>a.name.localeCompare(b.name));
  const besok=new Date(Date.now()+864e5).toISOString().slice(0,10);

  const form = isLeader ? `
    <div class="tbl-wrap" style="padding:14px 16px;margin-bottom:14px">
      <div class="section-title" style="margin-top:0">Tandai host libur</div>
      <div class="filter-row" style="flex-wrap:wrap;gap:8px">
        <select id="lb_host">${hosts.map(h=>`<option value="${h.email}">${h.name}</option>`).join('')}</select>
        <input type="date" id="lb_tgl" value="${besok}" />
        <select id="lb_ket">${LIBUR_KET.map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
        <button class="btn-accent" onclick="addLibur()">Tandai libur</button>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">Tanggal libur muncul di riwayat sesi host & dihitung "beres" di kelengkapan data.</div>
    </div>` : '';

  // bulan tersedia: gabungan bulan performa + bulan libur + bulan ini
  const months=[...new Set([thisMonth, ...allPerf.map(r=>(r.tanggal||'').slice(0,7)), ...allLibur.map(l=>(l.tanggal||'').slice(0,7))])].filter(Boolean).sort().reverse();
  const monthOpts=months.map(m=>{const[y,mo]=m.split('-');return `<option value="${m}" ${m===LIBUR_MONTH?'selected':''}>${new Date(y,mo-1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</option>`}).join('');

  // ── Kelengkapan data bulan terpilih ──
  const [ly,lm]=LIBUR_MONTH.split('-').map(Number);
  const daysIn=new Date(ly,lm,0).getDate();
  const isCur=LIBUR_MONTH===thisMonth;
  const lastDay=isCur? new Date().getDate() : daysIn;   // bulan berjalan: cek sampai hari ini saja
  const cards=hosts.map(h=>{
    const gapOf = plat => {
      const miss=[], off=[];
      for(let d=1;d<=lastDay;d++){
        const tgl=`${LIBUR_MONTH}-${String(d).padStart(2,'0')}`;
        if(allPerf.some(r=>r.host_email===h.email && r.tanggal===tgl && platOf(r)===plat)) continue;
        if(allLibur.some(l=>l.host_email===h.email && l.tanggal===tgl)) off.push(d);
        else miss.push(d);
      }
      return {miss, off};
    };
    const g={tiktok:gapOf('tiktok'), shopee:gapOf('shopee')};
    const totMiss=g.tiktok.miss.length+g.shopee.miss.length;
    const row=plat=>{
      const x=g[plat];
      return `<div class="plat-row" style="--pg:var(--${plat})">
        <div class="plat-name">${PLAT_LABEL[plat]}</div>
        <div style="flex:1">${x.miss.length
          ? `<span style="color:var(--warn);font-weight:600">${x.miss.length} belum diisi:</span> <span style="color:var(--text2)">${x.miss.join(', ')}</span>`
          : `<span style="color:var(--good);font-weight:600">Lengkap</span>`}</div>
      </div>`;
    };
    const off=g.tiktok.off;
    return `<div class="tbl-wrap complete-card" style="margin-bottom:10px">
      <div class="complete-head"><span style="display:flex;align-items:center;gap:10px"><span class="h-ava" style="background:${h.color};width:28px;height:28px;font-size:12px;border-radius:8px">${h.name[0]}</span>${h.name}</span>${totMiss?`<span class="stamp warn">${ic('alert','sm')} ${totMiss} belum diisi</span>`:`<span class="stamp good">${ic('check','sm')} Lengkap</span>`}</div>
      ${row('tiktok')}${row('shopee')}
      ${off.length?`<div class="complete-foot">${ic('off','sm')} Libur: ${off.join(', ')}</div>`:''}
    </div>`;
  }).join('');

  // ── Daftar libur bulan terpilih (dikelompokkan per host, tanggal urut) ──
  const liburList=allLibur.filter(l=>(l.tanggal||'').startsWith(LIBUR_MONTH));
  const byHost={};
  liburList.forEach(l=>{ (byHost[l.host_email]=byHost[l.host_email]||[]).push(l); });
  const listHTML = liburList.length ? Object.keys(byHost)
    .sort((a,b)=>hostNameByEmail(a).localeCompare(hostNameByEmail(b)))
    .map(email=>{
      const items=byHost[email].sort((a,b)=>(a.tanggal||'').localeCompare(b.tanggal||''));
      return `<div class="tbl-wrap" style="padding:10px 14px;margin-bottom:8px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div style="font-weight:700">${hostNameByEmail(email)} <span style="font-weight:400;font-size:12px;color:var(--text3)">· ${items.length} hari libur</span></div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
          ${items.map(l=>`<span class="stamp mute" style="font-weight:500" title="${l.keterangan||''}">${ic('off','sm')} ${fmtTglHari(l.tanggal)}${l.keterangan?` · ${l.keterangan}`:''}${isLeader?`<button class="row-btn del" onclick="deleteLibur('${l.id}')" title="Hapus tanda libur" style="width:20px;height:20px;margin:0 -4px 0 2px;box-shadow:none">${ic('x','sm')}</button>`:''}</span>`).join('')}
        </div>
      </div>`;
    }).join('') : '<p class="empty" style="padding:8px 0">Tidak ada libur di bulan ini.</p>';

  box.innerHTML = `${form}
    <div class="filter-row" style="margin-bottom:12px"><label style="font-size:13px;color:var(--text2)">Bulan:</label>
      <select onchange="LIBUR_MONTH=this.value;renderLibur()">${monthOpts}</select></div>
    <div class="section-title">Kelengkapan data ${isCur?'(sampai hari ini)':''}</div>
    ${cards || '<p class="empty">Belum ada host aktif.</p>'}
    <div class="section-title" style="margin-top:22px">Daftar libur</div>
    ${listHTML}`;
}
async function addLibur(){
  const email=document.getElementById('lb_host').value;
  const tgl=document.getElementById('lb_tgl').value;
  const ket=document.getElementById('lb_ket').value.trim();
  if(!email||!tgl){ showToast('Pilih host dan tanggal dulu.','error'); return; }
  if(allPerf.some(r=>r.host_email===email && r.tanggal===tgl)){ showToast('Host ini sudah punya data sesi di tanggal itu.','error'); return; }
  const {error}=await sb.from('host_libur').insert([{host_email:email,tanggal:tgl,keterangan:ket||null}]);
  if(error){ showToast(error.code==='23505'?'Tanggal itu sudah ditandai libur untuk host ini.':'Gagal: '+error.message,'error'); return; }
  showToast(`${hostNameByEmail(email)} ditandai libur ${fmtTgl(tgl)}.`,'success');
  await fetchLibur(); refreshLiburViews();
}
async function deleteLibur(id){
  if(!confirm('Hapus tanda libur ini?')) return;
  const {error}=await sb.from('host_libur').delete().eq('id',id);
  if(error){ showToast('Gagal: '+error.message,'error'); return; }
  showToast('Tanda libur dihapus.','success');
  await fetchLibur(); refreshLiburViews();
}

  if(myData.some(r=>r.tanggal===tgl)){ showToast('Kamu sudah punya data sesi di tanggal itu, jadi tidak bisa ditandai libur.','error'); return; }
  if(allLibur.some(l=>l.host_email===ME && l.tanggal===tgl)){ showToast('Tanggal itu sudah kamu tandai.','error'); return; }
  const btn=document.getElementById('ml_btn'); btn.disabled=true;
  const {error}=await sb.from('host_libur').insert([{host_email:ME,tanggal:tgl,keterangan:ket}]);
  btn.disabled=false;
  if(error){
    const msg = error.code==='23505' ? 'Tanggal itu sudah ditandai.'
      : (error.code==='42501' || /row-level security/i.test(error.message||'')) ? 'Belum ada izin untuk menandai libur sendiri. Minta leader mengaktifkannya.'
      : 'Gagal: '+error.message;
    showToast(msg,'error'); return;
  }
  showToast(`${fmtTgl(tgl)} ditandai: ${ket}.`,'success');
  await fetchLibur(); renderMyLibur(); renderHome(); renderMine();
}
async function deleteMyLibur(id){
  if(!confirm('Hapus tanda ini? Tanggalnya akan dihitung belum diisi lagi kalau tidak ada data sesi.')) return;
  const {data,error}=await sb.from('host_libur').delete().eq('id',id).select();
  if(error){ showToast('Gagal: '+error.message,'error'); return; }
  if(!data||!data.length){ showToast('Belum ada izin untuk menghapus tanda sendiri. Minta leader mengaktifkannya.','error'); return; }
  showToast('Tanda dihapus.','success');
  await fetchLibur(); renderMyLibur(); renderHome(); renderMine();
}
function refreshLiburViews(){
  renderLibur();
  if(window._drillEmail && document.getElementById('ddView')) drilldown(window._drillEmail, window._drillName, false);
  if(document.getElementById('mineContent')) renderMine();
}

// ── Tabs / utils ──
function switchTab(el,id){
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function switchTabById(id){
  document.querySelectorAll('#tabs .tab').forEach((t,i)=>{
    t.classList.toggle('active', (id==='l-home'&&i===0)||(id==='l-dash'&&i===1)||(id==='l-import'&&i===2));
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function fillDateDropdown(id){
  const sel=document.getElementById(id); if(!sel)return;
  const today=new Date(); let html='';
  for(let i=0;i<30;i++){
    const d=new Date(today); d.setDate(today.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    html+=`<option value="${iso}">${d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</option>`;
  }
  sel.innerHTML=html;
}
function fmtTgl(t){ if(!t)return'—'; const d=new Date(t+'T00:00:00'); return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}); }
function fmtTglHari(t){ if(!t)return'—'; const d=new Date(t+'T00:00:00'); return d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'}); }

init();
