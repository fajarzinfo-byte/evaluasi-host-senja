<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07090e">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Senja Studio">
<title>Dashboard — Evaluasi Host</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>window.Chart&&(Chart.defaults.color='#808899',Chart.defaults.borderColor='rgba(255,255,255,.06)',Chart.defaults.font.family="'Archivo',system-ui,sans-serif");</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
  /* ════════ SENJA STUDIO · GEL LAMPU STUDIO ════════
     Kaca gelap berasap; warna hanya datang dari gel (brand & platform).
     Status (naik/turun/peringatan) punya warna sendiri, bukan warna gel. */
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root{
    color-scheme:dark;
    --bg:#07090e; --bg-deep:#040509;
    --glass:rgba(17,20,30,.56); --glass-hi:rgba(255,255,255,.055); --glass-lo:rgba(255,255,255,.015);
    --surface:rgba(17,20,30,.56); --surface2:rgba(255,255,255,.05); --surface3:rgba(255,255,255,.085);
    --solid:#10131c;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
    --text:#eef1f7; --text2:#b1b8c8; --text3:#808899;
    /* key light: aksi utama, pilihan aktif, fokus */
    --accent:#e9edf7; --accent-bg:rgba(233,237,247,.09); --accentbg:rgba(233,237,247,.09);
    --key:#e9edf7; --key-ink:#0b0e15;
    /* status */
    --good:#5ee39a; --good-bg:rgba(94,227,154,.12); --goodbg:rgba(94,227,154,.12); --good-border:rgba(94,227,154,.3); --goodbd:rgba(94,227,154,.3);
    --warn:#f5c451; --warn-bg:rgba(245,196,81,.12); --warnbg:rgba(245,196,81,.12); --warn-border:rgba(245,196,81,.3); --warnbd:rgba(245,196,81,.3);
    --bad:#ff6b7d; --bad-bg:rgba(255,107,125,.12); --badbg:rgba(255,107,125,.12); --bad-border:rgba(255,107,125,.32); --badbd:rgba(255,107,125,.32);
    --star-on:#f5c451; --star-off:rgba(255,255,255,.1);
    /* gel platform */
    --tiktok:#3fe0e8; --shopee:#ff7a3d;
    /* gel brand (urutan BRANDS) */
    --gel-1:#a28bff; --gel-2:#5b8cff; --gel-3:#ff5fb4; --gel-4:#c9f25c;
    --twilight:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));
    --dusk:var(--solid);
    --r:14px; --rs:9px; --radius:14px; --radius-sm:9px;
    --lift:inset 0 1px 0 rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.055), 0 22px 44px -28px rgba(0,0,0,.85);
    --blur:blur(22px) saturate(150%);
    --ease:cubic-bezier(.16,1,.3,1);
    --font:'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  html{ background:#07090e; scrollbar-color:rgba(255,255,255,.16) transparent; -webkit-text-size-adjust:100%; }
  body{ font-family:var(--font); font-size:14px; line-height:1.55; color:var(--text); min-height:100vh;
    background:transparent; -webkit-font-smoothing:antialiased; font-feature-settings:'cv11' 1; }
  /* lampu studio: tiga gel di luar bingkai, menyala tembus kaca */
  body::before{ content:''; position:fixed; inset:-10vh -10vw; z-index:-1; pointer-events:none;
    background:
      radial-gradient(40vw 36vh at 86% 2%, rgba(162,139,255,.26), transparent 70%),
      radial-gradient(34vw 34vh at 4% 34%, rgba(91,140,255,.2), transparent 70%),
      radial-gradient(44vw 38vh at 60% 104%, rgba(255,95,180,.2), transparent 70%),
      radial-gradient(26vw 26vh at 100% 70%, rgba(201,242,92,.08), transparent 70%),
      radial-gradient(46vw 40vh at 50% 32%, rgba(162,139,255,.12), transparent 72%),
      radial-gradient(120vw 90vh at 50% 40%, transparent 55%, var(--bg-deep) 100%),
      var(--bg); }
  ::selection{ background:rgba(233,237,247,.28); color:#fff; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.13); border-radius:10px; border:3px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.24); background-clip:padding-box; border:3px solid transparent; }
  :focus-visible{ outline:2px solid var(--key); outline-offset:2px; border-radius:6px; }
  input, select, textarea, button{ font-family:inherit; color:inherit; }
  input::placeholder, textarea::placeholder{ color:#6d7586; }
  select option{ background:var(--solid); color:var(--text); }
  input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(.85); opacity:.7; cursor:pointer; }
  a{ color:inherit; text-underline-offset:3px; }
  .ic{ width:18px; height:18px; flex-shrink:0; vertical-align:-3px; }
  .ic.sm{ width:14px; height:14px; vertical-align:-2px; }
  .ic.lg{ width:22px; height:22px; }
  /* angka: sel tetap, tidak menggeser layout saat berubah */
  .num, .stat-v, .hero-num, .calc-v, .stat-value, .host-score, .eval-score, .section-avg, td{ font-variant-numeric:tabular-nums; }
  /* angka utama: sedikit dipadatkan seperti nomor di swatch gel */
  .hero-num, .stat-v, .stat-value, .host-score, .eval-score{ font-stretch:88%; }

  /* ── Kaca ── */
  .glass{ background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), var(--glass);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift); border-radius:var(--r); }

  /* ── Tombol ── */
  .btn-primary, .btn-accent{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--key); color:var(--key-ink); border:0; border-radius:10px; font-weight:600; cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 24px -12px rgba(233,237,247,.55);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s; }
  .btn-primary{ width:100%; padding:12px; font-size:14px; }
  .btn-accent{ padding:10px 18px; font-size:13px; }
  .btn-primary:hover, .btn-accent:hover{ background:#fff; transform:translateY(-1px); box-shadow:0 1px 0 #fff inset, 0 14px 30px -12px rgba(233,237,247,.7); }
  .btn-primary:active, .btn-accent:active{ transform:translateY(0); }
  .btn-primary:disabled, .btn-accent:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-ghost{ display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:10px; border:0;
    background:var(--surface2); box-shadow:inset 0 0 0 1px var(--border2); color:var(--text2); font-size:12.5px; font-weight:500;
    cursor:pointer; text-decoration:none; transition:background .15s, color .15s; }
  .btn-ghost:hover{ background:var(--surface3); color:var(--text); }

  /* ── Form ── */
  .fg{ display:flex; flex-direction:column; }
  .fg.full{ grid-column:1 / -1; }
  .fg label{ font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px; }
  .fg input, .fg select, .fg textarea, .filter-row select, .month-sel{
    width:100%; padding:9px 12px; border:0; border-radius:var(--rs); font-size:13.5px; color:var(--text);
    background:rgba(4,6,10,.45); box-shadow:inset 0 0 0 1px var(--border2), inset 0 1px 2px rgba(0,0,0,.35); outline:none;
    transition:box-shadow .15s, background .15s; }
  .fg input:hover, .fg select:hover, .filter-row select:hover, .month-sel:hover{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), inset 0 1px 2px rgba(0,0,0,.35); }
  .fg input:focus, .fg select:focus, .fg textarea:focus, .filter-row select:focus, .month-sel:focus{
    box-shadow:inset 0 0 0 1px var(--key), 0 0 0 4px rgba(233,237,247,.08); background:rgba(4,6,10,.6); }
  .hint{ font-size:12px; color:var(--text3); margin-top:4px; }
  .msg{ display:none; margin-top:12px; font-size:13px; }

  /* ── Status: dicap, tidak menghilang ── */
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px;
    background:var(--surface2); color:var(--text2); box-shadow:inset 0 0 0 1px var(--border2); white-space:nowrap; }
  .gel-dot{ display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--gel,#fff);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35); margin-right:7px; vertical-align:1px; flex-shrink:0; }
  .stamp{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px; white-space:nowrap; }
  .stamp.good{ color:var(--good); background:var(--good-bg); box-shadow:inset 0 0 0 1px var(--good-border); }
  .stamp.warn{ color:var(--warn); background:var(--warn-bg); box-shadow:inset 0 0 0 1px var(--warn-border); }
  .stamp.bad{ color:var(--bad); background:var(--bad-bg); box-shadow:inset 0 0 0 1px var(--bad-border); }
  .stamp.mute{ color:var(--text2); background:var(--surface2); box-shadow:inset 0 0 0 1px var(--border2); }

  /* ── Tabel ── */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ background:rgba(255,255,255,.035); text-align:left; padding:10px 12px; font-weight:600; color:var(--text3); font-size:11.5px;
    white-space:nowrap; border-bottom:1px solid var(--border); }
  td{ padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover td{ background:rgba(255,255,255,.035); }
  .num{ text-align:right; }

  /* ── Toast ── */
  .toast{ position:fixed; bottom:24px; right:24px; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:500;
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), rgba(17,20,30,.82); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    box-shadow:var(--lift), 0 18px 40px -16px rgba(0,0,0,.7); z-index:9999; opacity:0; transform:translateY(8px);
    transition:opacity .22s var(--ease), transform .22s var(--ease); pointer-events:none; max-width:min(420px,calc(100vw - 32px)); }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.success{ color:var(--good); box-shadow:var(--lift), inset 0 0 0 1px var(--good-border); }
  .toast.error{ color:var(--bad); box-shadow:var(--lift), inset 0 0 0 1px var(--bad-border); }

  /* ── Modal ── */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(3,4,8,.62); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    z-index:200; align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.open{ display:flex; animation:fadeIn .2s var(--ease); }
  .modal-box{ width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)), rgba(14,17,26,.86);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift), 0 40px 90px -30px rgba(0,0,0,.9);
    animation:rise .28s var(--ease); }
  .modal-top{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
  .modal-h{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .modal-x{ background:none; border:0; font-size:22px; line-height:1; cursor:pointer; color:var(--text3); padding:2px 8px; border-radius:8px; }
  .modal-x:hover{ color:var(--text); background:var(--surface2); }
  .modal-content{ padding:18px 20px; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--border); }

  /* ── Skeleton ── */
  .skel{ background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.09) 45%,rgba(255,255,255,.04) 60%);
    background-size:300% 100%; animation:skel 1.3s linear infinite; border-radius:14px; }
  @keyframes skel{ from{background-position:120% 0} to{background-position:-60% 0} }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes rise{ from{opacity:0; transform:translateY(10px) scale(.985)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }
  /* ── Tanda studio, login, header (halaman evaluasi) ── */
  .brand-dot{ position:relative; isolation:isolate; width:34px; height:34px; flex-shrink:0; border-radius:0; box-shadow:none;
    background:linear-gradient(var(--gel-3),var(--gel-3)) 28% 100% / 60% 60% no-repeat; }
  .brand-dot::before, .brand-dot::after{ content:''; position:absolute; width:60%; height:60%; border-radius:4px; mix-blend-mode:screen; }
  .brand-dot::before{ left:0; top:0; background:var(--gel-1); }
  .brand-dot::after{ right:0; top:16%; background:var(--tiktok); }
  .brand-mark{ display:flex; align-items:center; gap:12px; margin-bottom:1.5rem; }
  .brand-name{ font-size:18px; font-weight:600; letter-spacing:-.02em; color:var(--text); }
  .brand-name span{ color:var(--text3); font-weight:500; }
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.25rem; position:relative; overflow:hidden; }
  .login-wrap::before{ content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(22vw 34vh at 18% 100%, rgba(162,139,255,.55), transparent 70%), radial-gradient(22vw 34vh at 40% 100%, rgba(91,140,255,.5), transparent 70%), radial-gradient(22vw 34vh at 62% 100%, rgba(255,95,180,.5), transparent 70%), radial-gradient(22vw 34vh at 84% 100%, rgba(201,242,92,.32), transparent 70%); filter:blur(14px); }
  .login-card{ position:relative; z-index:1; width:100%; max-width:400px; padding:2.25rem; border-radius:20px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)), rgba(14,17,26,.55);
    -webkit-backdrop-filter:blur(28px) saturate(160%); backdrop-filter:blur(28px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.07), 0 40px 80px -30px rgba(0,0,0,.9); }
  .login-card h1{ font-size:20px; font-weight:600; letter-spacing:-.02em; margin-bottom:6px; }
  .login-card p{ font-size:13.5px; color:var(--text2); margin-bottom:1.25rem; }
  .login-card input{ width:100%; padding:12px 14px; border:0; border-radius:10px; font-size:14px; margin-bottom:10px; background:rgba(4,6,10,.5); box-shadow:inset 0 0 0 1px var(--border2); outline:none; }
  .login-card input:focus{ box-shadow:inset 0 0 0 1px var(--key), 0 0 0 4px rgba(233,237,247,.08); }
  .app-header{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:1.6rem; }
  .app-header h1{ font-size:20px; font-weight:600; letter-spacing:-.025em; line-height:1.2; }
  .app-header p{ font-size:13px; color:var(--text3); margin-top:2px; }
  .btn-logout{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:10px; border:0; background:var(--surface2);
    box-shadow:inset 0 0 0 1px var(--border2); color:var(--text2); font-size:12.5px; font-weight:500; cursor:pointer; text-decoration:none; transition:background .15s,color .15s; }
  .btn-logout:hover{ background:var(--surface3); color:var(--text); }
  .section-title{ font-size:16px; font-weight:600; letter-spacing:-.015em; margin-bottom:1rem; }
  .empty{ text-align:center; padding:3rem 1rem; color:var(--text3); font-size:13.5px; }
  .stat, .chart-card, .progress-card, .eval-card, .target-box{
    background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), var(--glass);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift); border:0; border-radius:var(--r); }
  .stat{ padding:14px 16px; text-align:left; }
  .stat-label{ font-size:12px; font-weight:500; color:var(--text2); margin-bottom:6px; }
  .stat-value{ font-size:22px; font-weight:600; color:var(--text); letter-spacing:-.025em; line-height:1.2; }
  .stat-value.good{ color:var(--good); } .stat-value.warn{ color:var(--warn); } .stat-value.bad{ color:var(--bad); }
  .chart-card{ padding:16px 18px; margin-bottom:1.4rem; }
  .chart-title{ font-size:13.5px; font-weight:600; margin-bottom:14px; }
  .chart-wrap{ height:200px; position:relative; }
  /* skor per area: batang tipis, warna status */
  .progress-card{ padding:16px 18px; margin-bottom:1.4rem; }
  .progress-title{ font-size:13.5px; font-weight:600; margin-bottom:12px; }
  .progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:9px; }
  .progress-label{ font-size:12.5px; color:var(--text2); width:170px; flex-shrink:0; }
  .progress-bar-wrap{ flex:1; height:6px; background:rgba(255,255,255,.07); border-radius:6px; overflow:hidden; }
  .progress-bar{ height:100%; border-radius:6px; background:var(--key); transition:width .6s var(--ease); }
  .progress-val{ font-size:12.5px; font-weight:600; width:32px; text-align:right; font-variant-numeric:tabular-nums; }
  /* riwayat evaluasi */
  .eval-card{ margin-bottom:10px; overflow:hidden; }
  .eval-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 16px; cursor:pointer; transition:background .15s; }
  .eval-head:hover{ background:rgba(255,255,255,.035); }
  .eval-title{ font-size:14px; font-weight:600; }
  .eval-meta{ font-size:12.5px; color:var(--text3); margin-top:1px; }
  .eval-score{ font-size:17px; font-weight:600; letter-spacing:-.02em; }
  .eval-score.good{ color:var(--good); } .eval-score.warn{ color:var(--warn); } .eval-score.bad{ color:var(--bad); }
  .eval-body{ display:none; border-top:1px solid var(--border); padding:14px 16px; }
  .eval-body.open{ display:block; animation:fadeIn .2s var(--ease); }
  .sec-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; font-variant-numeric:tabular-nums; }
  .sec-row:last-child{ border-bottom:none; }
  .sec-name{ color:var(--text2); }
  .verdict-box{ border-radius:var(--rs); padding:10px 14px; margin-top:12px; font-size:13px; font-weight:500; }
  .verdict-box.good{ background:var(--good-bg); box-shadow:inset 0 0 0 1px var(--good-border); color:var(--good); }
  .verdict-box.warn{ background:var(--warn-bg); box-shadow:inset 0 0 0 1px var(--warn-border); color:var(--warn); }
  .verdict-box.bad{ background:var(--bad-bg); box-shadow:inset 0 0 0 1px var(--bad-border); color:var(--bad); }
  .commitment-note{ margin-top:10px; padding:11px 14px; background:rgba(4,6,10,.35); box-shadow:inset 0 0 0 1px var(--border); border-radius:var(--rs); font-size:13px; color:var(--text2); }
  .commitment-note strong{ color:var(--text); display:block; margin-bottom:3px; font-size:12px; font-weight:600; }
  .commitment-note.target{ background:var(--warn-bg); box-shadow:inset 0 0 0 1px var(--warn-border); }
  .commitment-note.target strong{ color:var(--warn); }
  .skel-row{ height:64px; margin-bottom:10px; }
  /* ── dashboard.html ── */
  .btn-full{ display:flex; align-items:center; justify-content:center; width:100%; padding:12px; border-radius:10px; font-size:14px; font-weight:600;
    background:var(--key); color:var(--key-ink); text-decoration:none; }
  .success-msg{ display:none; margin-top:12px; font-size:13px; color:var(--good); }
  .app-wrap{ display:none; max-width:1480px; margin:0 auto; padding:1.25rem clamp(1rem,3.4vw,3rem) 4rem; }
  .page-header{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:1.6rem; }
  .page-header h1{ font-size:20px; font-weight:600; letter-spacing:-.025em; line-height:1.2; }
  .page-header p{ font-size:13px; color:var(--text3); margin-top:2px; }
  .header-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .header-actions a{ text-decoration:none; }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:10px; border:0; background:var(--surface2);
    box-shadow:inset 0 0 0 1px var(--border2); color:var(--text2); font-size:12.5px; font-weight:500; cursor:pointer; transition:background .15s,color .15s; }
  .btn:hover{ background:var(--surface3); color:var(--text); }
  .btn.btn-accent{ background:var(--key); color:var(--key-ink); box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 24px -12px rgba(233,237,247,.55); padding:7px 14px; }
  .btn.btn-accent:hover{ background:#fff; color:var(--key-ink); }
  .summary-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:1.4rem; }
  .filter-row{ display:flex; gap:10px; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
  .filter-row label{ font-size:13px; color:var(--text2); }
  .filter-row select, .filter-row input{ padding:8px 30px 8px 12px; border:0; border-radius:var(--rs); font-size:13px; color:var(--text);
    background:rgba(4,6,10,.45); box-shadow:inset 0 0 0 1px var(--border2); outline:none; }
  .filter-row select:focus{ box-shadow:inset 0 0 0 1px var(--key), 0 0 0 4px rgba(233,237,247,.08); }
  .brand-tabs{ display:flex; gap:2px; margin-bottom:1.4rem; padding:3px; flex-wrap:wrap; width:fit-content; max-width:100%; border-radius:11px;
    background:rgba(255,255,255,.035); box-shadow:inset 0 0 0 1px var(--border); }
  .tab{ display:inline-flex; align-items:center; padding:6px 13px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; color:var(--text2); transition:background .18s var(--ease), color .18s; }
  .tab:hover{ color:var(--text); }
  .tab.active{ color:var(--text); background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07)); box-shadow:inset 0 1px 0 rgba(255,255,255,.16); }
  .host-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-bottom:2rem; }
  .host-card{ background:linear-gradient(180deg,var(--glass-hi),var(--glass-lo)), var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    box-shadow:var(--lift); border-radius:var(--r); padding:16px 18px; cursor:pointer; transition:transform .22s var(--ease), box-shadow .22s var(--ease); }
  .host-card:hover{ transform:translateY(-2px); box-shadow:var(--lift), 0 26px 40px -26px rgba(233,237,247,.4); }
  .host-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px; }
  .host-avatar{ width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px; color:#fff; flex-shrink:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 6px 14px -6px rgba(0,0,0,.8); }
  .host-name{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .host-brand-badge{ display:inline-flex; flex-wrap:wrap; gap:2px 10px; font-size:12px; color:var(--text3); margin-top:2px; }
  .host-brand-badge .gel-dot{ width:7px; height:7px; margin-right:5px; }
  .host-score{ font-size:24px; font-weight:600; letter-spacing:-.03em; line-height:1.1; }
  .host-score.good{ color:var(--good); } .host-score.warn{ color:var(--warn); } .host-score.bad{ color:var(--bad); }
  .host-score.none{ color:var(--text3); font-size:15px; font-weight:500; }
  .host-stats{ display:flex; gap:20px; }
  .host-stat{ font-size:12px; color:var(--text3); }
  .host-stat span{ font-weight:600; color:var(--text); display:block; font-size:13.5px; font-variant-numeric:tabular-nums; }
  .trend-up{ color:var(--good)!important; } .trend-down{ color:var(--bad)!important; }
  .mini-chart{ margin-top:14px; height:54px; }
  .modal{ width:100%; max-width:600px; max-height:84vh; overflow-y:auto; border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)), rgba(14,17,26,.9);
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:var(--lift), 0 40px 90px -30px rgba(0,0,0,.9); animation:rise .28s var(--ease); }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1;
    background:rgba(16,19,28,.92); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
  .modal-title{ font-size:16px; font-weight:600; letter-spacing:-.015em; }
  .modal-close{ background:none; border:0; font-size:22px; line-height:1; cursor:pointer; color:var(--text3); padding:2px 8px; border-radius:8px; }
  .modal-close:hover{ color:var(--text); background:var(--surface2); }
  .modal-body{ padding:16px 20px; }
  .modal-body .good{ color:var(--good); } .modal-body .warn{ color:var(--warn); } .modal-body .bad{ color:var(--bad); }
  .eval-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
  .eval-row:last-child{ border-bottom:none; }
  .eval-row-date{ font-size:13px; color:var(--text2); }
  .eval-row-score{ font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .skel-card{ height:160px; }
  @media (max-width:600px){ .summary-grid{ grid-template-columns:1fr 1fr; } .host-grid{ grid-template-columns:1fr; } }
  @media (min-width:1100px){
    .summary-grid{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
    .stat{ padding:18px 20px; } .stat-value{ font-size:26px; }
    .host-grid{ grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
    .host-card{ padding:18px 20px; } .mini-chart{ height:64px; }
    .filter-row{ display:inline-flex; margin-right:16px; margin-bottom:1.4rem; vertical-align:middle; }
    .brand-tabs{ display:inline-flex; vertical-align:middle; }
    .modal{ max-width:680px; }
  }

  @media (min-width:1100px){ .app-wrap{ max-width:none; padding:1.75rem clamp(24px,2.6vw,56px) 4rem; } }
</style>
</head>
<body>

<div class="login-wrap" id="login-section" style="display:none">
  <div class="login-card">
    <div class="brand-mark"><div class="brand-dot"></div><div class="brand-name">Senja <span>Studio</span></div></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem">Mengarahkan ke halaman login…</p>
    <a class="btn-full" href="https://tinyurl.com/performa-senja" style="display:block;text-align:center;text-decoration:none">Ke Beranda</a>
  </div>
</div>

<div class="app-wrap" id="app-section">
  <div class="page-header">
    <div style="display:flex;align-items:center;gap:11px">
      <div class="brand-dot" style="width:30px;height:30px"></div>
      <div>
        <h1>Dashboard Evaluasi Host</h1>
        <p id="last-updated">Memuat data...</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="https://tinyurl.com/performa-senja"><button class="btn">← Beranda</button></a>
      <a href="https://tinyurl.com/leader-senja"><button class="btn">+ Input Evaluasi</button></a>
      <button class="btn btn-accent" onclick="exportPDF()">Export PDF</button>
      <button class="btn btn-logout" onclick="sb.auth.signOut().then(()=>location.reload())">Keluar</button>
    </div>
  </div>

  <div class="summary-grid">
    <div class="stat"><div class="stat-label">Total host</div><div class="stat-value" id="s-hosts">6</div></div>
    <div class="stat"><div class="stat-label">Total evaluasi</div><div class="stat-value" id="s-evals">—</div></div>
    <div class="stat"><div class="stat-label">Rata-rata tim</div><div class="stat-value" id="s-avg">—</div></div>
    <div class="stat"><div class="stat-label">Perlu perhatian</div><div class="stat-value bad" id="s-attention">—</div></div>
  </div>

  <div class="filter-row">
    <label>Periode:</label>
    <select id="month-filter" onchange="renderDashboard()">
      <option value="">Semua waktu</option>
    </select>
  </div>

  <div class="brand-tabs">
    <div class="tab active" onclick="filterBrand('', this)">Semua</div>
  </div>

  <div class="host-grid" id="host-grid"><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div></div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = 'https://pwqozfqqaewjpnpkydpo.supabase.co';
const SUPABASE_ANON = 'sb_publishable_1VeUHXivMJkjqKGnAP4_vw_tr614ZcW';
const LEADER_EMAIL  = 'fajarzinfo@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Config tim dinamis dari tabel app_config (dikelola lewat tab "Tim" di Beranda) ──
let HOST_LIST=[], BRANDS=[];
const BRAND_GEL=['#a28bff','#5b8cff','#ff5fb4','#c9f25c','#f0a6ff','#ffb38a','#9fd0ff','#d8c8ff'];   // gel brand, sama dengan performa.html
const gelOf = b => BRAND_GEL[Math.max(0,BRANDS.indexOf(b)) % BRAND_GEL.length];
const HOST_PALETTE=['#e879f9','#a855f7','#3b82f6','#06b6d4','#f97316','#ef4444','#22c55e','#eab308','#f472b6','#38bdf8'];
async function loadConfig(){
  const {data,error}=await sb.from('app_config').select('hosts,brands').eq('id',1).single();
  if(error||!data){ alert('Config tim belum ada di database.\nJalankan SQL setup app_config (Panduan bagian 3.7) lalu refresh.'); return false; }
  BRANDS=data.brands||[];
  HOST_LIST=Object.entries(data.hosts||{}).map(([email,v],i)=>({
    name:v.name, email, brands:v.brands||[], brand:(v.brands||[])[0]||'',
    color:v.color||HOST_PALETTE[i%HOST_PALETTE.length], active:v.active!==false,
  }));
  // tab brand dinamis
  const tabs=document.querySelector('.brand-tabs');
  if(tabs) tabs.innerHTML='<div class="tab active" onclick="filterBrand(\'\', this)">Semua</div>'+
    BRANDS.map(b=>`<div class="tab" onclick="filterBrand('${b}', this)"><i class="gel-dot" style="--gel:${gelOf(b)}"></i>${b}</div>`).join('');
  return true;
}

let allData = [];
let activeBrand = '';
let miniCharts = {};

async function loadData() {
  const { data, error } = await sb.from('evaluasi_host').select('*').order('created_at', { ascending: true });
  if (error) { console.error(error); return; }
  allData = data || [];
  populateMonthFilter();
  renderDashboard();
  const now = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  document.getElementById('last-updated').textContent = 'Terakhir diperbarui: ' + now;
}

function populateMonthFilter() {
  const months = [...new Set(allData.filter(d => d.tanggal).map(d => d.tanggal.slice(0, 7)))].sort().reverse();
  const sel = document.getElementById('month-filter');
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    const [y, mo] = m.split('-');
    opt.textContent = new Date(y, mo-1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    sel.appendChild(opt);
  });
}

function getFilteredData() {
  const month = document.getElementById('month-filter').value;
  return allData.filter(d => {
    const brandOk = !activeBrand || d.brand === activeBrand;
    const monthOk = !month || (d.tanggal && d.tanggal.startsWith(month));
    return brandOk && monthOk;
  });
}

function filterBrand(brand, el) {
  activeBrand = brand;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderDashboard();
}

function renderDashboard() {
  const filtered = getFilteredData();
  const filteredForHosts = getFilteredData();
  const hosts = (activeBrand ? HOST_LIST.filter(h => h.brands.includes(activeBrand)) : HOST_LIST)
    .filter(h => h.active || filteredForHosts.some(d => d.host === h.name));
  const shEl=document.getElementById('s-hosts'); if(shEl) shEl.textContent = HOST_LIST.filter(h=>h.active).length;

  // Summary stats
  const allAvgs = filtered.map(d => parseFloat(d.avg)).filter(v => !isNaN(v));
  const teamAvg = allAvgs.length ? (allAvgs.reduce((a,b)=>a+b,0)/allAvgs.length).toFixed(1) : '—';
  document.getElementById('s-evals').textContent = filtered.length;
  const avgEl = document.getElementById('s-avg');
  avgEl.textContent = teamAvg;
  avgEl.className = 'stat-value ' + (teamAvg !== '—' ? (parseFloat(teamAvg) >= 4 ? 'good' : parseFloat(teamAvg) >= 2.5 ? 'warn' : 'bad') : '');

  // Attention: hosts with avg < 3
  const attention = hosts.filter(h => {
    const hData = filtered.filter(d => d.host === h.name);
    if (!hData.length) return false;
    const la = parseFloat(hData[hData.length-1].avg);
    return la < 3;
  }).length;
  document.getElementById('s-attention').textContent = attention;

  // Host grid
  Object.values(miniCharts).forEach(c => c.destroy());
  miniCharts = {};

  const grid = document.getElementById('host-grid');
  if (!hosts.length) { grid.innerHTML = '<p class="empty">Tidak ada host.</p>'; return; }

  grid.innerHTML = hosts.map(h => {
    const hData = filtered.filter(d => d.host === h.name);
    const latest = hData.length ? hData[hData.length-1] : null;
    const latestAvg = latest ? parseFloat(latest.avg) : null;
    const cls = latestAvg !== null ? (latestAvg >= 4 ? 'good' : latestAvg >= 2.5 ? 'warn' : 'bad') : 'none';
    const scoreText = latestAvg !== null ? latestAvg.toFixed(1) + '/5' : 'Belum ada';

    let trend = '';
    if (hData.length >= 2) {
      const diff = parseFloat(hData[hData.length-1].avg) - parseFloat(hData[hData.length-2].avg);
      if (diff > 0.05) trend = `<span class="trend-up">↑ +${diff.toFixed(1)}</span>`;
      else if (diff < -0.05) trend = `<span class="trend-down">↓ ${diff.toFixed(1)}</span>`;
      else trend = `→ Stabil`;
    }

    const lastEval = latest?.tanggal ? new Date(latest.tanggal + 'T00:00:00').toLocaleDateString('id-ID', {day:'numeric',month:'short'}) : '—';

    return `<div class="host-card" onclick="showDetail('${h.name}')">
      <div class="host-card-head">
        <div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="host-avatar" style="background:${h.color};width:32px;height:32px;font-size:13px">${h.name[0]}</div>
            <div>
              <div class="host-name">${h.name}</div>
              <span class="host-brand-badge">${h.brands.map(b=>`<span><i class="gel-dot" style="--gel:${gelOf(b)}"></i>${b}</span>`).join('')}</span>
            </div>
          </div>
        </div>
        <div class="host-score ${cls}">${scoreText}</div>
      </div>
      <div class="host-stats">
        <div class="host-stat">Evaluasi<span>${hData.length}x</span></div>
        <div class="host-stat">Tren<span>${trend || '—'}</span></div>
        <div class="host-stat">Terakhir<span>${lastEval}</span></div>
      </div>
      ${hData.length > 1 ? `<div class="mini-chart"><canvas id="mini-${h.name}"></canvas></div>` : ''}
    </div>`;
  }).join('');

  // Mini charts
  hosts.forEach(h => {
    const hData = filtered.filter(d => d.host === h.name);
    if (hData.length > 1) {
      const canvas = document.getElementById(`mini-${h.name}`);
      if (canvas) {
        miniCharts[h.name] = new Chart(canvas, {
          type: 'line',
          data: {
            labels: hData.map((_, i) => i+1),
            datasets: [{ data: hData.map(d => parseFloat(d.avg)), borderColor: 'rgba(233,237,247,.85)', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: false }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false, min: 0, max: 5 } } }
        });
      }
    }
  });
}

function showDetail(hostName) {
  const hData = allData.filter(d => d.host === hostName).reverse();
  const h = HOST_LIST.find(x => x.name === hostName);
  document.getElementById('modal-title').textContent = hostName + ' — ' + (h?.brand || '');
  document.getElementById('modal-body').innerHTML = !hData.length
    ? '<p class="empty">Belum ada evaluasi.</p>'
    : hData.map(ev => {
        const avg = parseFloat(ev.avg);
        const cls = avg >= 4 ? 'good' : avg >= 2.5 ? 'warn' : 'bad';
        const tgl = ev.tanggal ? new Date(ev.tanggal + 'T00:00:00').toLocaleDateString('id-ID', {day:'numeric',month:'short',year:'numeric'}) : '—';
        const evalKe = ev.evaluasi_ke ? 'Evaluasi ke-' + ev.evaluasi_ke : tgl;
        const secRows = (ev.sections||[]).map(sec => {
          const vals = sec.scores.filter(v=>v>0);
          const sa = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : '—';
          return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);color:var(--text2)"><span>${sec.title}</span><span style="font-weight:500;color:var(--text)">${sa}/5</span></div>`;
        }).join('');
        const targetHtml = ev.target ? `<div style="margin-top:10px;padding:9px 12px;background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-border);border-radius:8px;font-size:12.5px;color:var(--text)"><strong style="color:var(--warn)">Target:</strong> ${ev.target}</div>` : '';
        const commitHtml = ev.commitment ? `<div style="margin-top:6px;padding:9px 12px;background:rgba(4,6,10,.35);box-shadow:inset 0 0 0 1px var(--border);border-radius:8px;font-size:12.5px;color:var(--text2)"><strong style="color:var(--text)">Komitmen:</strong> ${ev.commitment}</div>` : '';
        return `<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;margin-bottom:10px">
            <div><div style="font-weight:500">${evalKe}</div><div style="font-size:12px;color:var(--text3)">${tgl}</div></div>
            <div style="font-size:18px;font-weight:600" class="${cls}">${avg.toFixed(1)}/5</div>
          </div>
          ${secRows}${targetHtml}${commitHtml}
        </div>`;
      }).join('');
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) { if (e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('open'); }

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const month = document.getElementById('month-filter').value;
  const monthLabel = month ? new Date(month + '-01').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) : 'Semua Waktu';
  const filtered = getFilteredData();

  doc.setFontSize(16);
  doc.setFont('helvetica', 'bold');
  doc.text('Laporan Evaluasi Host', 14, 20);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(100);
  doc.text('Periode: ' + monthLabel, 14, 28);
  doc.text('Digenerate: ' + new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }), 14, 34);
  doc.setTextColor(0);

  // Summary table per host
  const rows = HOST_LIST.map(h => {
    const hData = filtered.filter(d => d.host === h.name);
    if (!hData.length) return [h.name, h.brands.join(' · '), '—', '—', '—', '—'];
    const avgs = hData.map(d => parseFloat(d.avg));
    const latest = avgs[avgs.length-1];
    const best = Math.max(...avgs);
    const trend = avgs.length >= 2 ? (avgs[avgs.length-1] - avgs[avgs.length-2]).toFixed(1) : '—';
    const verdict = latest >= 4 ? 'Sangat Baik' : latest >= 3 ? 'Cukup Baik' : 'Perlu Improvement';
    return [h.name, h.brands.join(' · '), hData.length, latest.toFixed(1) + '/5', best.toFixed(1) + '/5', verdict];
  });

  doc.autoTable({
    startY: 42,
    head: [['Host', 'Brand', 'Jml Evaluasi', 'Skor Terkini', 'Skor Terbaik', 'Status']],
    body: rows,
    styles: { fontSize: 10, cellPadding: 4 },
    headStyles: { fillColor: [26, 25, 23], textColor: 255, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [247, 246, 243] },
  });

  // Detail per host
  let y = doc.lastAutoTable.finalY + 14;
  HOST_LIST.forEach(h => {
    const hData = filtered.filter(d => d.host === h.name);
    if (!hData.length) return;

    if (y > 240) { doc.addPage(); y = 20; }

    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.text(h.name + ' (' + h.brands.join(' · ') + ')', 14, y);
    y += 6;

    const detailRows = hData.reverse().map(ev => {
      const tgl = ev.tanggal ? new Date(ev.tanggal + 'T00:00:00').toLocaleDateString('id-ID') : '—';
      const evalKe = ev.evaluasi_ke ? 'Ke-' + ev.evaluasi_ke : '—';
      const target = ev.target || '—';
      return [evalKe, tgl, parseFloat(ev.avg).toFixed(1) + '/5', target.length > 40 ? target.slice(0,40) + '...' : target];
    });

    doc.autoTable({
      startY: y,
      head: [['Evaluasi', 'Tanggal', 'Skor', 'Target']],
      body: detailRows,
      styles: { fontSize: 9, cellPadding: 3 },
      headStyles: { fillColor: [80, 80, 80], textColor: 255 },
      margin: { left: 14 },
    });
    y = doc.lastAutoTable.finalY + 10;
  });

  const filename = `laporan_evaluasi_host_${month || 'semua'}_${new Date().toISOString().slice(0,10)}.pdf`;
  doc.save(filename);
}

async function initApp() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    if (session.user.email !== LEADER_EMAIL) {
      alert('Akun ini tidak memiliki akses leader.');
      await sb.auth.signOut();
      window.location.href = 'https://tinyurl.com/performa-senja';
      return;
    }
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('app-section').style.display = 'block';
    if(!(await loadConfig())) return;
    await loadData();
  } else {
    // Login terpusat di Beranda — tampilkan layar pengalihan lalu arahkan
    document.getElementById('login-section').style.display = 'flex';
    window.location.href = 'https://tinyurl.com/performa-senja';
  }
}

initApp();
</script>
</body>
</html>
